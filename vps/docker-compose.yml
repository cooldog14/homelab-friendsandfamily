# wg-easy on the VPS: the WireGuard hub for 10.44.0.0/24.
# chill-01 (10.44.0.2) is a client here, like every phone and laptop.
# Mirrors live /opt/vps/docker-compose.yml (v14 checked 2026-09-12).
# NEVER delete ./state (peers, keys, server keypair) or every client dies.
# .env (0600, live-only, never in git): WG_EASY_PASSWORD_HASH
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "0.0.0.0:51820:51820/udp"       # NOTE: overridden to 51822 below
      - "127.0.0.1:51821:51821/tcp"      # web UI via Caddy -> vpn.malice.biz
    environment:
      WG_HOST: vps.malice.biz
      PASSWORD_HASH: ${WG_EASY_PASSWORD_HASH}
      WG_DEFAULT_ADDRESS: 10.44.0.x
      # No DNS pushed to clients (no DNS server since AdGuard removal 2026-09-11;
      # split-tunnel clients keep their own resolver). Cleared in the override;
      # do not re-add a DNS here.
      WG_DEFAULT_DNS: ""
      WG_ALLOWED_IPS: "10.44.0.0/24"
      PORT: 51821
    volumes:
      - ./state/wg-easy:/etc/wireguard
