# Live kernel wg owns 51820/udp (10.30 network) -> chill 10.44 runs on 51822.
# NOTE: compose merges `ports` by union, so plain re-listing here would ALSO
# bind 51820 and fail. `!override` replaces the base list instead.
# Static IP: the VPS host routes 10.44.0.0/24 via this container (Caddy ->
# chill-01). Without a stable IP the host route breaks on every recreate.
services:
  wg-easy:
    ports: !override
      - "0.0.0.0:51822:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    # VPS Caddy originates traffic with src=<bridge IP>, which chill-01's
    # WireGuard drops (outside peer AllowedIPs). NAT it to 10.44.0.1 here.
    # Peers (real 10.44.x sources) are unaffected.
    # NOTE: do NOT add the VPS public IP (or any peer endpoint IP) to
    # WG_ALLOWED_IPS: it creates an endpoint-in-AllowedIPs routing loop that
    # kills the tunnel (verified 2026-09-11). Peers reach the admin UI at
    # http://10.44.0.1:51821 through the tunnel instead of by public name.
    environment:
      WG_POST_UP: iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
      # No DNS pushed to clients (repo: no DNS server; split-tunnel clients
      # keep their own resolver). Peers with stale DNS=10.44.0.2 must clear
      # it on-device after AdGuard's removal 2026-09-11.
      WG_DEFAULT_DNS: ""
      # Host publishes 51822/udp -> container 51820. Clients must dial the
      # PUBLIC port (default 51820 would strand every new peer).
      WG_CONFIG_PORT: 51822
    networks:
      chillwg:
        ipv4_address: 172.27.0.2

networks:
  chillwg:
    name: vps_chillwg
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/24
