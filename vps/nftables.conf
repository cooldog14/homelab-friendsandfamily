#!/usr/sbin/nft -f
# Non-HTTP ports Caddy cannot proxy, DNAT'd from the VPS public interface to
# chill-01 (10.44.0.2): mumble (64738), neko WebRTC (52000 tcp+udp), screego
# TURN (3478 tcp+udp, 52100-52200 udp).
#
# Own table, no "flush ruleset" -- flushing would wipe crowdsec/ufw rules.
# The declare/delete/recreate dance is what makes re-running this idempotent.
# Apply without touching /etc/nftables.conf: `nft -f chill/vps/nftables.conf`.
# Persist across reboots with one line in /etc/nftables.conf:
#   include "/etc/nftables.d/homelab_nat.conf"
# Former 10.30/arr WireGuard rules are retired. Remove them from the live VPS
# ruleset during cleanup; this file only owns the chill-01 public forwards.

table ip homelab_nat
delete table ip homelab_nat

table ip homelab_nat {
	chain prerouting {
		type nat hook prerouting priority dstnat;
		iifname "eth0" tcp dport { 64738, 52000, 3478 } dnat to 10.44.0.2
		iifname "eth0" udp dport { 64738, 52000, 3478 } dnat to 10.44.0.2
		iifname "eth0" udp dport 52100-52200 dnat to 10.44.0.2
	}
	chain postrouting {
		type nat hook postrouting priority srcnat;
		# Without this, replies leave home via its default route and the client sees silence.
		# Cost: mumble logs every client as 10.44.0.1, so per-IP bans are useless.
		ip daddr 10.44.0.2 masquerade
	}
	chain input {
		type filter hook input priority filter;
		# Traffic report origin (VPS Caddy :8088, itself gated to
		# 10.44.0.0/24): the live inet firewall table defaults to drop
		# and is not owned here, so accept the tunnel side in our own
		# table. Tunnel-only: never expose this port publicly.
		iifname "chill0" tcp dport 8088 accept
	}
}
