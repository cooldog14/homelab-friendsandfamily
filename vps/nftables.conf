#!/usr/sbin/nft -f
# Non-HTTP ports Caddy cannot proxy, DNAT'd from the VPS public interface to
# chill-01 (10.44.0.2): mumble (64738), neko WebRTC (52000 tcp+udp),
# screego TURN (3478 tcp+udp, 52100-52200 udp), minecraft (25565 tcp).
# P2P forwards (6881, 50300) go to gluetun's wg0 tun address 10.30.0.4 instead:
# that traffic is the stack's exit tunnel, so inbound peers must still land on
# the tunnel-side IP and not on 10.44.0.2.
#
# Own table, no "flush ruleset" -- flushing would wipe crowdsec/ufw rules.
# `destroy table` keeps re-running this idempotent.
# Apply without touching /etc/nftables.conf: `nft -f chill/vps/nftables.conf`.
# Persist across reboots with one line in /etc/nftables.conf:
#   include "/etc/nftables.d/homelab_nat.conf"
# The VPS wg0 (:51820, 10.30.0.0/24) is live and load-bearing: it is the
# P2P exit for gluetun on chill-01. Only its malice peer (10.30.0.3 +
# 192.168.1.0/24) was retired on 2026-10-30.
#
# NOTE: input accepts do NOT belong in this table. Base chains run in
# priority order and a drop verdict is terminal: the live inet firewall
# table (priority filter, policy drop) drops tunnel packets regardless of
# any accept here (verified 2026-09-18: SYNs logged by such a rule, zero
# SYN-ACKs out). VPS input ports live in /etc/nftables.conf ON THE BOX
# (live-managed, reboot-persistent), same as the stage-2 51824 accept.

destroy table ip homelab_nat

table ip homelab_nat {
	chain prerouting {
		type nat hook prerouting priority dstnat;
		iifname "eth0" tcp dport { 64738, 52000, 3478, 25565 } dnat to 10.44.0.2
		iifname "eth0" udp dport { 64738, 52000, 3478 } dnat to 10.44.0.2
		iifname "eth0" udp dport 52100-52200 dnat to 10.44.0.2
		# qBittorrent + slskd inbound, DNAT over wg0 into gluetun's tunnel IP.
		iifname "eth0" tcp dport { 6881, 50300 } dnat to 10.30.0.4
		iifname "eth0" udp dport { 6881, 50300 } dnat to 10.30.0.4
	}
	chain postrouting {
		type nat hook postrouting priority srcnat;
		# Without this, replies leave home via its default route and the client sees silence.
		# Cost: mumble logs every client as 10.44.0.1, so per-IP bans are useless.
		ip daddr 10.44.0.2 masquerade
	}
}
