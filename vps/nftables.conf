#!/usr/sbin/nft -f
# Non-HTTP ports Caddy cannot proxy, DNAT'd down the tunnel to chill-01
# (10.44.0.2): mumble (64738), neko WebRTC (52000 tcp+udp), screego TURN
# (3478 tcp+udp, 52100-52200 udp).
#
# Model is VPS-hub: wg-easy runs ON the VPS (51820/udp binds there directly),
# so there is deliberately NO 51820 forward here. The old 51900 home-hub
# tunnel-in-tunnel design is gone; do not re-add it.
#
# Own table, no "flush ruleset" -- flushing would wipe crowdsec/ufw rules.
# The declare/delete/recreate dance is what makes re-running this idempotent.
# Apply without touching /etc/nftables.conf: `nft -f chill/vps/nftables.conf`.
# Persist across reboots with one line in /etc/nftables.conf:
#   include "/etc/nftables.d/homelab_nat.conf"
# (and install this file there). The legacy `table ip nat` DNAT block and the
# `table inet firewall` chains in /etc/nftables.conf are live-managed and
# LOAD-BEARING — do not touch. Inventory (audit 2026-09-12, same dstnat
# priority as this table so first-match wins and duplicates are harmless):
#   inet firewall prerouting: 52000 tcp+udp, 3478 tcp+udp, 52100-52200 udp
#     (eth0 + wg0 variants) -> 10.44.0.2  [eth0 traffic matches BOTH tables
#     (same dstnat priority, first-match-wins); wg0-originated traffic ONLY
#     matches legacy — deleting legacy breaks tunnel-side neko/screego]
#   inet firewall: 25565/tcp -> 10.30.0.3 (Minecraft, old world) -- APPROVED FOR
#     REMOVAL 2026-09-15. Only entry in the legacy table that is safe to drop.
#   inet firewall: kernel-WG 51820/udp accept + 10.30 masquerades (arr net)
# DECIDED 2026-09-15: the 10.30 arr LXC STAYS. So this table never converges with
# the legacy one -- stop treating that as pending work. The duplicate dstnat
# priority keeping first-match-wins is now permanent, not transitional, and the
# wg0-originated rules in the legacy table remain load-bearing for tunnel-side
# neko/screego. Do not delete the legacy table; do not fold it in here.

table ip homelab_nat
delete table ip homelab_nat

table ip homelab_nat {
	chain prerouting {
		type nat hook prerouting priority dstnat;
		iifname != "wg0" tcp dport { 64738, 52000, 3478 } dnat to 10.44.0.2
		iifname != "wg0" udp dport { 64738, 52000, 3478 } dnat to 10.44.0.2
		iifname != "wg0" udp dport 52100-52200 dnat to 10.44.0.2
	}
	chain postrouting {
		type nat hook postrouting priority srcnat;
		# Without this, replies leave home via its default route and the client sees silence.
		# Cost: mumble logs every client as 10.44.0.1, so per-IP bans are useless.
		ip daddr 10.44.0.2 masquerade
	}
}
