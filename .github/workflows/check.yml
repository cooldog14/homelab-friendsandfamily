name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nftables

      - name: Show tool versions
        run: |
          docker version
          docker compose version
          shellcheck --version
          sudo nft --version

      - name: Run repo checks
        run: make check

      - name: Check nftables syntax
        run: sudo nft -c -f vps/nftables.conf
