services:
  mc:
    # Paper 26.2: latest STABLE Paper (26.3 is experimental-alpha only as of
    # 2026-09-28, needs Java 25). Players set their launcher profile to 26.2
    # until Paper headlines 26.3 stable (~late Oct by past drops), then bump
    # VERSION + image tag. Same world format either way, no reset.
    # Purpur instead: TYPE: PURPUR (same API, more config knobs), one line.
    # NB: 26.1+ servers need Java 25+: keep the -java25 image variant.
    image: itzg/minecraft-server:2026.9.2-java25
    restart: unless-stopped
    user: "1000:1000"
    stdin_open: true
    tty: true
    ports:
      - "10.44.0.2:25565:25565" # DNAT'd from the VPS
    environment:
      EULA: "TRUE"
      VERSION: "26.2"
      TYPE: PAPER
      MEMORY: 4G
      TZ: Europe/Paris
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
      # Server-side plugins (players install nothing). Pinned jars, bump
      # the URLs alongside VERSION. spark is pre-bundled in Paper 1.21+,
      # so only Chunky (pre-generate chunks before launch day) is listed.
      # Jars land in /data/plugins (mirror disk, restic-backed); removing
      # a URL auto-removes its jar on next start.
      PLUGINS: |
        https://cdn.modrinth.com/data/fALzjamp/versions/MdY6JATr/Chunky-Bukkit-1.5.3.jar
    volumes:
      # World + config live on the mirror disk: covered by restic /mnt/data.
      - /mnt/data/apps/minecraft:/data
