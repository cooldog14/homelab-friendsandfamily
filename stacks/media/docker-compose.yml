services:
  jellyfin:
    image: jellyfin/jellyfin:12.3.0
    user: "1000:1000"
    mem_limit: 3g
    mem_reservation: 1536m
    cpus: 2.0
    # Intel UHD 630 passed through to the VM (hostpci0 00:02.0 on malice,
    # vfio-pci bound). Guest has card0/card1 + renderD128 (group 991).
    # Enable QSV/VAAPI in the Jellyfin dashboard; CPU fallback otherwise.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"
    ports:
      - "10.44.0.2:8096:8096"
      # LAN-only bind for direct TV playback (no internet hairpin via the VPS).
      # Specific-IP bind, never 0.0.0.0; host UFW scopes 8096 to 192.168.1.0/24.
      # 192.168.1.200 is outside the Livebox DHCP pool (.10-.150).
      - "192.168.1.200:8096:8096"
    volumes:
      - ./state/jellyfin-config:/config
      # Disposable HLS/transcode cache lives on the fast SSD, not the VM root.
      - /mnt/fast/jellyfin-cache:/cache
      - /mnt/data:/data
      - /mnt/pool/media/movies:/pool/movies:ro
      - /mnt/pool/media/tv:/pool/tv:ro
    restart: unless-stopped
    environment:
      TZ: Europe/Paris

  # VPN egress for torrent/P2P traffic (qbittorrent, prowlarr, flaresolverr,
  # slskd). Ported from the arr LXC: without this, P2P egresses via the home
  # IP instead of the VPS. Keys live in .env (never in git).
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "10.44.0.2:8701:8701"
      - "10.44.0.2:9696:9696"
      - "10.44.0.2:5030:5030"
    volumes:
      - ./state/gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      VPN_ENDPOINT_IP: ${VPN_ENDPOINT_IP}
      VPN_ENDPOINT_PORT: ${VPN_ENDPOINT_PORT}
      FIREWALL_VPN_INPUT_PORTS: "6881,50300"
      # Local docker networks bypass the VPN (arr apps reach qbit/prowlarr
      # through gluetun). /12 covers every compose bridge; Docker assigns
      # subnets dynamically, so a narrower value breaks after re-creation.
      FIREWALL_OUTBOUND_SUBNETS: "172.16.0.0/12"
      WIREGUARD_PUBLIC_KEY: ${VPS_WG_PUBKEY}
      TZ: Europe/Paris
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.2
    mem_limit: 1536m
    mem_reservation: 768m
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
      WEBUI_PORT: "8701"
      WEBUI_ADDRESS: "0.0.0.0"
      WEBUI_EXTERNAL_ACCESS: "true"
    volumes:
      - ./state/qbittorrent:/config
      - /mnt/data:/data
      - /mnt/pool/downloads:/pool/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./state/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
      HEADLESS: "true"
      BROWSER_TIMEOUT: "120000"
      MAX_TIMEOUT: "120000"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    restart: unless-stopped
    ports:
      - "10.44.0.2:7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./state/radarr:/config
      - /mnt/data:/data
      - /mnt/pool/media/movies:/pool/movies
      - /mnt/pool/downloads:/pool/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    restart: unless-stopped
    ports:
      - "10.44.0.2:8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./state/sonarr:/config
      - /mnt/data:/data
      - /mnt/pool/media/tv:/pool/tv
      - /mnt/pool/downloads:/pool/downloads

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    restart: unless-stopped
    ports:
      - "10.44.0.2:6767:6767"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Paris
    volumes:
      - ./state/bazarr:/config
      - /mnt/data:/data
      # Subtitles are written next to the video files (4TB disk).
      - /mnt/pool/media/movies:/pool/movies
      - /mnt/pool/media/tv:/pool/tv

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    init: true
    security_opt:
      - no-new-privileges:true
    # Root-in-container over a 1000-owned bind needs DAC_OVERRIDE for
    # writes (proven 2026-11-03: cap_drop ALL = EACCES restart loop).
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
    environment:
      TZ: Europe/Paris
      LOG_LEVEL: info
    ports:
      - "10.44.0.2:5055:5055"
    volumes:
      - ./state/jellyseerr:/app/config
    depends_on:
      - jellyfin
      - radarr
      - sonarr

  navidrome:
    image: deluan/navidrome:0.64.2
    user: "1000:1000"
    ports:
      - "10.44.0.2:4533:4533"
    environment:
      TZ: Europe/Paris
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "false"
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_SCANNER_SCHEDULE: "@every 1h"
    volumes:
      - ./state/navidrome:/data
      - /mnt/data/media/music:/music:ro
    restart: unless-stopped

  wrtag:
    image: sentriz/wrtag:v0.30.0
    user: "1000:1000"
    ports:
      - "10.44.0.2:7373:7373"
    environment:
      WRTAG_PATH_FORMAT: '/mnt/data/media/music/clean/{{ artists .Release.Artists | sort | join "; " | safepath }}/({{ .Release.ReleaseGroup.FirstReleaseDate.Year }}) {{ .Release.Title | safepath }}{{ if not (eq .ReleaseDisambiguation "") }} ({{ .ReleaseDisambiguation | safepath }}){{ end }}/{{ if gt (len .Release.Media) 1 }}d{{ pad0 2 .Media.Position }} {{ end }}{{ pad0 2 .Track.Position }}.{{ .Media.TrackCount | pad0 2 }} {{ if .IsCompilation }}{{ artistsString .Track.Artists | safepath }} - {{ end }}{{ .Track.Title | safepath }}{{ .Ext }}'
      WRTAG_WEB_API_KEY: ${WRTAG_WEB_API_KEY}
      WRTAG_WEB_LISTEN_ADDR: ":7373"
      WRTAG_WEB_DB_PATH: /data/wrtag.db
      WRTAG_WEB_NUM_WORKERS: "4"
      WRTAG_WEB_AUTH: "basic-auth-from-api-key"
      WRTAG_LOG_LEVEL: "info"
      WRTAG_ADDON: "lyrics lrclib genius musixmatch"
      WRTAG_KEEP_FILE: "origin.yaml,*.cue,*.log"
      WRTAG_COVER_UPGRADE: "true"
    volumes:
      - ./state/wrtag:/data
      - /mnt/data:/mnt/data
    restart: unless-stopped

  octo-fiesta:
    image: ghcr.io/v1ck3s/octo-fiesta:v0.11
    user: "1000:1000"
    ports:
      - "10.44.0.2:5274:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Library__DownloadPath: /app/downloads
      Subsonic__Url: "http://navidrome:4533"
      Subsonic__AdminUsername: ${SUBSONIC_ADMIN_USERNAME}
      Subsonic__AdminPassword: ${SUBSONIC_ADMIN_PASSWORD}
      Subsonic__MusicService: Deezer
      Subsonic__StorageMode: Permanent
      Subsonic__DownloadMode: Track
      Subsonic__AutoUpgradeQuality: "false"
      Subsonic__DisableLibraryScan: "false"
      Subsonic__EnableExternalPlaylists: "true"
      Subsonic__PlaylistsDirectory: playlists
      Subsonic__ExplicitFilter: All
      Subsonic__FolderTemplate: "{artist}/({year}) {album}/{track} - {title}"
      Deezer__Arl: ${DEEZER_ARL}
      Deezer__Quality: "flac"
    volumes:
      - /mnt/data/media/music/clean:/app/downloads
      - ./state/octo-fiesta:/config
    depends_on:
      - navidrome
    restart: unless-stopped

  feishin:
    image: ghcr.io/jeffvli/feishin:1.17.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "10.44.0.2:9180:9180"
    environment:
      SERVER_NAME: "Octo-Fiesta"
      SERVER_TYPE: subsonic
      SERVER_URL: "https://fiesta.malice.biz"
      SERVER_LOCK: "true"
      LEGACY_AUTHENTICATION: "true"
      ANALYTICS_DISABLED: "true"
    depends_on:
      - octo-fiesta
    restart: unless-stopped

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2422-preview
    mem_limit: 1536m
    mem_reservation: 768m
    ports:
      - "10.44.0.2:4567:4567"
    environment:
      TZ: Europe/Paris
      AUTH_MODE: ui_login
      AUTH_USERNAME: ${SUWAYOMI_AUTH_USERNAME:?set SUWAYOMI_AUTH_USERNAME in media .env}
      # Password via file, not env: compose expands `$VAR` inside .env
      # values, which silently truncates passwords containing `$`.
      # The secret file lives on the host only (never git), created from
      # media .env once: python3 -c reading SUWAYOMI_AUTH_PASSWORD.
      AUTH_PASSWORD_FILE: /run/secrets/suwayomi-auth-password
    volumes:
      - /mnt/data/apps/suwayomi:/home/suwayomi/.local/share/Tachidesk
      - /opt/stacks/media/suwayomi-auth-password:/run/secrets/suwayomi-auth-password:ro
    restart: unless-stopped

  slskd:
    image: slskd/slskd:0.26.0
    user: "1000:1000"
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - wrtag
    environment:
      TZ: Europe/Paris
      SLSKD_CONFIG: /app/slskd.yml
      SLSKD_UMASK: "0002"
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD}
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_USERNAME: ${SLSKD_USERNAME:?set SLSKD_USERNAME in media .env}
      SLSKD_PASSWORD: ${SLSKD_PASSWORD:?set SLSKD_PASSWORD in media .env}
      SLSKD_JWT_KEY: ${SLSKD_JWT_KEY:?set SLSKD_JWT_KEY in media .env}
    volumes:
      - ./state/slskd:/app
      - ./config/slskd/slskd.yml:/app/slskd.yml:ro
      - ./config/slskd/autotag.sh:/app/scripts/autotag.sh:ro
      - /mnt/data:/data
    restart: unless-stopped
