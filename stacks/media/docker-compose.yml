services:
  jellyfin:
    image: jellyfin/jellyfin:10.11
    user: "1000:1000"
    # Intel iGPU is passed through to the VM (see /dev/dri on chill-01).
    # Native KVM IDs: video group is 44. No render node exists, so verify
    # VAAPI/QSV in the jellyfin dashboard after deploy; CPU fallback otherwise.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
    ports:
      - "${WG_IP:-10.44.0.2}:8096:8096"
    volumes:
      - ./state/jellyfin-config:/config
      - ./state/jellyfin-cache:/cache
      - ${DATA_LOCATION:-/mnt/data}:/data
      # Bulk media lives on the 4TB disk (VM /mnt/pool, TODO storage layout).
      # Change library paths to /pool/movies and /pool/tv in the jellyfin UI.
      - /mnt/pool/media/movies:/pool/movies:ro
      - /mnt/pool/media/tv:/pool/tv:ro
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}

  # VPN egress for torrent/P2P traffic (qbittorrent, prowlarr, flaresolverr,
  # slskd). Ported from the arr LXC: without this, P2P egresses via the home
  # IP instead of the VPS. Keys live in .env (never in git).
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "${WG_IP:-10.44.0.2}:8701:8701"
      - "6881:6881"
      - "6881:6881/udp"
      - "${WG_IP:-10.44.0.2}:9696:9696"
      - "${WG_IP:-10.44.0.2}:8191:8191"
      - "${WG_IP:-10.44.0.2}:5030:5030"
    volumes:
      - ./state/gluetun:/gluetun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      VPN_ENDPOINT_IP: ${VPN_ENDPOINT_IP}
      VPN_ENDPOINT_PORT: ${VPN_ENDPOINT_PORT}
      FIREWALL_VPN_INPUT_PORTS: ${FIREWALL_VPN_INPUT_PORTS:-6881}
      # Local docker networks bypass the VPN (arr apps reach qbit/prowlarr
      # through gluetun). /12 covers every compose bridge; Docker assigns
      # subnets dynamically, so a narrower value breaks after re-creation.
      FIREWALL_OUTBOUND_SUBNETS: "172.16.0.0/12"
      WIREGUARD_PUBLIC_KEY: ${VPS_WG_PUBKEY}
      TZ: ${TIMEZONE:-Europe/Paris}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.2
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Europe/Paris}
      WEBUI_PORT: "8701"
      WEBUI_ADDRESS: "0.0.0.0"
      WEBUI_EXTERNAL_ACCESS: "true"
    volumes:
      - ./state/qbittorrent:/config
      - ${DATA_LOCATION:-/mnt/data}:/data
      # Video downloads live on the 4TB disk. Point save paths at
      # /pool/downloads in the qbittorrent UI after migrating state.
      - /mnt/pool/downloads:/pool/downloads
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - ./state/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      LOG_LEVEL: info
      HEADLESS: "true"
      BROWSER_TIMEOUT: "120000"
      MAX_TIMEOUT: "120000"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1
    restart: unless-stopped
    ports:
      - "${WG_IP:-10.44.0.2}:7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - ./state/radarr:/config
      - ${DATA_LOCATION:-/mnt/data}:/data
      # Movies root folder is /pool/movies (4TB disk). Update root folders
      # and download-client remote path mappings in the radarr UI.
      - /mnt/pool/media/movies:/pool/movies
      - /mnt/pool/downloads:/pool/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.17
    restart: unless-stopped
    ports:
      - "${WG_IP:-10.44.0.2}:8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - ./state/sonarr:/config
      - ${DATA_LOCATION:-/mnt/data}:/data
      # TV root folder is /pool/tv (4TB disk). Update root folders
      # and download-client remote path mappings in the sonarr UI.
      - /mnt/pool/media/tv:/pool/tv
      - /mnt/pool/downloads:/pool/downloads

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.5.6
    restart: unless-stopped
    ports:
      - "${WG_IP:-10.44.0.2}:6767:6767"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - ./state/bazarr:/config
      - ${DATA_LOCATION:-/mnt/data}:/data
      # Subtitles are written next to the video files (4TB disk).
      - /mnt/pool/media/movies:/pool/movies
      - /mnt/pool/media/tv:/pool/tv

  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      LOG_LEVEL: info
    ports:
      - "${WG_IP:-10.44.0.2}:5055:5055"
    volumes:
      - ./state/jellyseerr:/app/config
    restart: unless-stopped
    depends_on:
      - jellyfin
      - radarr
      - sonarr

  navidrome:
    image: deluan/navidrome:0.63.2
    user: "1000:1000"
    ports:
      - "${WG_IP:-10.44.0.2}:4533:4533"
      - "127.0.0.1:4533:4533"
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLESHARING: "false"
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_SCANNER_SCHEDULE: "@every 1h"
    volumes:
      - ./state/navidrome:/data
      - ${DATA_LOCATION:-/mnt/data}/media/music:/music:ro
    restart: unless-stopped

  wrtag:
    image: sentriz/wrtag:v0.30.0
    user: "1000:1000"
    ports:
      - "${WG_IP:-10.44.0.2}:7373:7373"
    environment:
      WRTAG_PATH_FORMAT: '/mnt/data/media/music/clean/{{ artists .Release.Artists | sort | join "; " | safepath }}/({{ .Release.ReleaseGroup.FirstReleaseDate.Year }}) {{ .Release.Title | safepath }}{{ if not (eq .ReleaseDisambiguation "") }} ({{ .ReleaseDisambiguation | safepath }}){{ end }}/{{ if gt (len .Release.Media) 1 }}d{{ pad0 2 .Media.Position }} {{ end }}{{ pad0 2 .Track.Position }}.{{ .Media.TrackCount | pad0 2 }} {{ if .IsCompilation }}{{ artistsString .Track.Artists | safepath }} - {{ end }}{{ .Track.Title | safepath }}{{ .Ext }}'
      WRTAG_WEB_API_KEY: ${WRTAG_WEB_API_KEY}
      WRTAG_WEB_LISTEN_ADDR: ":7373"
      WRTAG_WEB_DB_PATH: /data/wrtag.db
      WRTAG_WEB_NUM_WORKERS: "4"
      WRTAG_WEB_AUTH: "disabled"
      WRTAG_LOG_LEVEL: "info"
      WRTAG_ADDON: "lyrics lrclib genius musixmatch"
      WRTAG_KEEP_FILE: "origin.yaml,*.cue,*.log"
      WRTAG_COVER_UPGRADE: "true"
    volumes:
      - ./state/wrtag:/data
      - ${DATA_LOCATION:-/mnt/data}:/mnt/data
    restart: unless-stopped

  octo-fiesta:
    image: ghcr.io/v1ck3s/octo-fiesta:v0.8
    user: "1000:1000"
    ports:
      - "${WG_IP:-10.44.0.2}:5274:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Library__DownloadPath: /app/downloads
      Subsonic__Url: "http://navidrome:4533"
      Subsonic__AdminUsername: ${SUBSONIC_ADMIN_USERNAME}
      Subsonic__AdminPassword: ${SUBSONIC_ADMIN_PASSWORD}
      Subsonic__MusicService: ${MUSIC_SERVICE:-Deezer}
      Subsonic__StorageMode: Permanent
      Subsonic__DownloadMode: Track
      Subsonic__AutoUpgradeQuality: "false"
      Subsonic__DisableLibraryScan: "false"
      Subsonic__EnableExternalPlaylists: "true"
      Subsonic__PlaylistsDirectory: playlists
      Subsonic__ExplicitFilter: All
      Subsonic__FolderTemplate: "{artist}/({year}) {album}/{track} - {title}"
      Deezer__Arl: ${DEEZER_ARL}
      Deezer__ArlFallback: ${DEEZER_ARL_FALLBACK:-}
      Deezer__Quality: "flac"
      Qobuz__UserAuthToken: ${QOBUZ_USER_AUTH_TOKEN:-}
      Qobuz__UserId: ${QOBUZ_USER_ID:-}
      Qobuz__Quality: ${QOBUZ_QUALITY:-}
      Tidal__TokenStore: /config/tidal-tokens.json
      Tidal__Quality: ${TIDAL_QUALITY:-}
      Tidal__ClientId: ${TIDAL_CLIENT_ID:-}
      Tidal__ClientSecret: ${TIDAL_CLIENT_SECRET:-}
      Tidal__AccessToken: ${TIDAL_ACCESS_TOKEN:-}
      Tidal__RefreshToken: ${TIDAL_REFRESH_TOKEN:-}
      Tidal__UserId: ${TIDAL_USER_ID:-}
      Tidal__CountryCode: ${TIDAL_COUNTRY_CODE:-}
      SquidWTF__Source: ${SQUIDWTF_SOURCE:-Qobuz}
      SquidWTF__Quality: ${SQUIDWTF_QUALITY:-}
      SquidWTF__InstanceTimeoutSeconds: ${SQUIDWTF_INSTANCE_TIMEOUT:-5}
      Yandex__OAuthToken: ${YANDEX_OAUTH_TOKEN:-}
      Yandex__Quality: ${YANDEX_QUALITY:-}
      Yandex__Language: ${YANDEX_LANGUAGE:-}
      Yandex__IncludeUnavailable: ${YANDEX_INCLUDE_UNAVAILABLE_TRACKS:-false}
    volumes:
      - ${DATA_LOCATION:-/mnt/data}/media/music/clean:/app/downloads
      - ./state/octo-fiesta:/config
    depends_on:
      - navidrome
    restart: unless-stopped

  feishin:
    image: ghcr.io/jeffvli/feishin:1.12.1
    ports:
      - "${WG_IP:-10.44.0.2}:9180:9180"
    environment:
      SERVER_NAME: "malice.biz"
      SERVER_TYPE: subsonic
      SERVER_URL: "https://fiesta.malice.biz"
      SERVER_LOCK: "true"
      ANALYTICS_DISABLED: "true"
    depends_on:
      - octo-fiesta
    restart: unless-stopped

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.3.2361-preview
    ports:
      - "${WG_IP:-10.44.0.2}:4567:4567"
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
    volumes:
      - ./state/suwayomi:/home/suwayomi/.local/share/Tachidesk
    restart: unless-stopped

  slskd:
    build:
      context: .
      dockerfile: Dockerfile.slskd
    image: local/slskd-wrtag:0.26.0
    user: "1000:1000"
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - wrtag
    environment:
      TZ: ${TIMEZONE:-Europe/Paris}
      SLSKD_CONFIG: /app/slskd.yml
      SLSKD_UMASK: "0002"
      SLSKD_SLSK_USERNAME: ${SLSKD_SLSK_USERNAME}
      SLSKD_SLSK_PASSWORD: ${SLSKD_SLSK_PASSWORD}
      SLSKD_SLSK_LISTEN_PORT: ${SLSK_LISTEN_PORT:-50300}
      SLSKD_DOWNLOADS_DIR: /data/downloads/slskd/complete
      SLSKD_INCOMPLETE_DIR: /data/downloads/slskd/incomplete
      SLSKD_SHARED_DIR: /data/media/music
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      SLSKD_WRTAG_API_KEY: ${WRTAG_WEB_API_KEY}
      SLSKD_REMOTE_CONFIGURATION: "false"
      SLSKD_REMOTE_FILE_MANAGEMENT: "false"
    volumes:
      - ./state/slskd:/app
      - ./config/slskd/slskd.yml:/app/slskd.yml:ro
      - ./config/slskd/autotag.sh:/app/scripts/autotag.sh:ro
      - ${DATA_LOCATION:-/mnt/data}:/data
    restart: unless-stopped
