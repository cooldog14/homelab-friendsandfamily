services:
  mumble:
    image: mumblevoip/mumble-server:v1.5.634
    security_opt:
      - no-new-privileges:true
    # Mumble entrypoint writes /data config as dropped user: needs CHOWN+
    # DAC_OVERRIDE. cap_drop ALL restart-loops (proven 2026-11-03).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    restart: unless-stopped
    ports:
      - "10.44.0.2:64738:64738"       # DNAT'd from the VPS
      - "10.44.0.2:64738:64738/udp"
    environment:
      MUMBLE_SUPERUSER_PASSWORD: ${MUMBLE_SUPERUSER_PASSWORD}
    volumes:
      - ./state/mumble:/data

  # Watch together. Profile copied from prod 2026-09-10 (prod untouched).
  # WebRTC: VPS DNATs 52000/tcp+udp (eth0 + wg0) to 10.44.0.2; ufw passes wg0.
  neko:
    image: ghcr.io/m1k1o/neko/firefox:3.2.0
    security_opt:
      - no-new-privileges:true
    # Neko supervisord chowns its socket to (0,1000): needs CHOWN+SETUID.
    # cap_drop ALL restart-loops (proven 2026-11-03).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2.0
    shm_size: "2gb"
    ports:
      - "10.44.0.2:8097:8080"   # public via VPS Caddy at neko.malice.biz
      - "10.44.0.2:52000:52000/udp"
      - "10.44.0.2:52000:52000/tcp"
    environment:
      NEKO_DESKTOP_SCREEN: "1280x720@30"
      NEKO_SERVER_PROXY: "true"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: ${NEKO_MEMBER_MULTIUSER_USER_PASSWORD}
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: ${NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD}
      NEKO_WEBRTC_NAT1TO1: "194.58.47.21"
      NEKO_WEBRTC_UDPMUX: "52000"
      NEKO_WEBRTC_TCPMUX: "52000"
    volumes:
      - ./state/neko/firefox:/home/neko/.mozilla/firefox/profile.default

  # Screen sharing. Host mode like prod (TURN range + signaling on host).
  # Listens on WG_IP only for signaling; TURN ports ride ufw's wg0 allowance.
  # Exception to the WG_IP-bind rule: network_mode host binds *:3478/52100-52200,
  # filtered by ufw (default deny; only 22/tcp + wg0 allowed). Do not add ufw allows.
  # Users file + secret copied from prod 2026-09-10 (prod untouched).
  screego:
    image: ghcr.io/screego/server:1.12.6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    network_mode: host
    environment:
      SCREEGO_EXTERNAL_IP: "dns:screego.malice.biz"
      SCREEGO_SECRET: ${SCREEGO_SECRET}
      SCREEGO_SERVER_ADDRESS: "10.44.0.2:5050"
      SCREEGO_TRUST_PROXY_HEADERS: "true"
      SCREEGO_AUTH_MODE: all
      SCREEGO_USERS_FILE: /data/users
      SCREEGO_TURN_PORT_RANGE: "52100:52200"
      # TURN is on chill-01 with LAN/docker/tunnel reachable: deny all
      # private peers, else any room guest can relay through them.
      SCREEGO_TURN_DENY_PEERS: "0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.1/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,239.0.0.0/8,255.255.255.255/32,::/128,::1/128,64:ff9b:1::/48,100::/64,2001::/32,2002::/16,fc00::/7,fe80::/10"
    volumes:
      - ./state/screego:/data:ro
