services:
  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.3
    restart: unless-stopped
    ports:
      - "${WG_IP}:8091:8080"
    volumes:
      - /mnt/data/apps/stirling/tessdata:/usr/share/tessdata
      - /mnt/data/apps/stirling/config:/configs
      - /mnt/data/apps/stirling/logs:/logs
      - /mnt/data/apps/stirling/customFiles:/customFiles
      - /mnt/data/apps/stirling/pipeline:/pipeline

  paperless-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - ./state/paperless-db:/var/lib/postgresql/data

  paperless-redis:
    image: redis:7-alpine
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--chromium-disable-javascript=true", "--chromium-allow-list=file:///tmp/.*"]

  tika:
    image: apache/tika:4.0.0
    restart: unless-stopped

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-redis
      - gotenberg
      - tika
    ports:
      - "${WG_IP}:8092:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_URL: https://paperless.malice.biz
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: Europe/Paris
    volumes:
      - /mnt/data/apps/paperless/data:/usr/src/paperless/data
      - /mnt/data/apps/paperless/media:/usr/src/paperless/media
      - /mnt/data/apps/paperless/export:/usr/src/paperless/export
      - /mnt/data/apps/paperless/consume:/usr/src/paperless/consume

  kavita:
    image: jvmilazz0/kavita:0.9.1
    restart: unless-stopped
    ports:
      - "${WG_IP}:8094:5000"
    volumes:
      - /mnt/data/media/books:/books
      - ./state/kavita:/kavita/config
