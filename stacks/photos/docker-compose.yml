services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.0
    restart: unless-stopped
    ports:
      # Public via VPS Caddy at photos.1x8.me. Kept public (share links);
      # the tailnet edge stays minimal (dockge + beszel only), so there is no
      # private immich name — uploads from your own devices hairpin via the VPS.
      - "${WG_IP:-10.44.0.2}:2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      UPLOAD_LOCATION: /photos
    volumes:
      - /mnt/fast/photos:/photos
    depends_on:
      - immich-db
      - immich-redis

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.0
    restart: unless-stopped
    volumes:
      - ./state/immich/model-cache:/cache

  immich-redis:
    image: redis:7-alpine
    restart: unless-stopped

  immich-db:
    # Immich >= 1.133 requires VectorChord (pgvecto.rs support dropped in 3.0).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
    volumes:
      - ./state/immich/db:/var/lib/postgresql/data
