services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.2.0
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      # Public via VPS Caddy at photos.malice.biz (2026-09-15), AND private at
      # immich.h.malice.biz. Prefer the private name from your own devices: public
      # uploads hairpin through the VPS and eat its bandwidth twice.
      - "10.44.0.2:2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      UPLOAD_LOCATION: /photos
    # Photo library lives on the mirror disk (VM /mnt/data = primary 2TB
    # disk per TODO storage layout), NOT on fast: SSD2 is cache/transcodes
    # only. A second restic repo on /mnt/backup carries the local copy.
    volumes:
      - /mnt/data/photos:/photos
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.2.0
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2.0
    volumes:
      - ./state/immich/model-cache:/cache

  immich-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  immich-db:
    # Immich >= 1.133 requires VectorChord (pgvecto.rs support dropped in 3.0).
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
    volumes:
      - ./state/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
