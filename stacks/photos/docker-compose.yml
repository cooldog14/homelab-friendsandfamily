services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      # Public via VPS Caddy at photos.malice.biz (2026-09-15), AND private at
      # immich.h.malice.biz. Prefer the private name from your own devices: public
      # uploads hairpin through the VPS and eat its bandwidth twice.
      - "10.44.0.2:2283:2283"
    environment:
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      UPLOAD_LOCATION: /photos
    # Photo library lives on the mirror disk (VM /mnt/data = primary 2TB
    # disk per TODO storage layout), NOT on fast: SSD2 is cache/transcodes
    # only. A second restic repo on /mnt/backup carries the local copy.
    volumes:
      - /mnt/data/photos:/photos
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1g
    cpus: 2.0
    volumes:
      - ./state/immich/model-cache:/cache

  immich-redis:
    image: redis:7.4.11-alpine
    security_opt:
      - no-new-privileges:true
    # The alpine entrypoint drops from root with setpriv: without SETUID/SETGID
    # it exits 127 with "setresuid failed: Operation not permitted".
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  immich-db:
    # PostgreSQL 18: PG14 passed end of life on 2026-11-12. The cluster is
    # migrated in place by the -upgrade variant of this image (pg_upgrade),
    # which leaves the old cluster as ./state/immich/db/14.bak.
    image: ghcr.io/immich-app/postgres:18-vectorchord1.1.1-pgvector0.8.5
    security_opt:
      - no-new-privileges:true
    # initdb/pg_upgrade chown the cluster and drop to postgres.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_DB: immich
    volumes:
      - ./state/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
