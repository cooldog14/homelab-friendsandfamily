# Delivery contract for alertmanager-gotify-bridge:2.3.2 (see
# stacks/observability/docker-compose.yml). The bridge builds a Gotify message
# from the `summary` and `description` ANNOTATIONS and reads Gotify priority
# from a numeric `priority` annotation (strconv.Atoi); it does NOT read the
# `severity` label. Every rule therefore needs all three annotations, and
# `host/check-alert-rules.py` enforces that contract in `make check`.
# critical -> priority 8, warning -> priority 5 (the bridge default).
groups:
  - name: homelab
    rules:
      - alert: HostDown
        expr: up{job=~"node|malice"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Hôte ne répond plus: {{ $labels.instance }}"
          description: "L'exporter de l'hôte {{ $labels.instance }} est down depuis 2 minutes."
      - alert: ContainerOOMKilled
        expr: sum by (name) (increase(container_oom_events_total[1h])) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Conteneur OOM: {{ $labels.name }}"
          description: "Le noyau a tué le conteneur au moins une fois pendant l'heure écoulée."
      - alert: KernelOOMKill
        expr: increase(node_vmstat_oom_kill[1h]) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "OOM noyau sur {{ $labels.instance }}"
          description: "Le noyau a tué un processus pendant l'heure écoulée."
      - alert: TargetDown
        expr: up{job=~"prometheus|alertmanager|grafana|cadvisor|blackbox|gotify-bridge"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Cible Prometheus down: {{ $labels.job }}"
          description: "{{ $labels.instance }} ne répond plus."
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Endpoint public down: {{ $labels.instance }}"
          description: "Le probe HTTP échoue depuis 2 minutes."
      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} > 0 and probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 24 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Certificat bientôt expiré: {{ $labels.instance }}"
          description: "Expire dans {{ $value | humanizeDuration }}."
      - alert: PrivateEndpointDown
        expr: probe_success{job="blackbox-private"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Vhost privé down: {{ $labels.instance }}"
          description: "Le probe HTTPS privé échoue depuis 5 minutes (Caddy ou son upstream)."
      - alert: TLSCertExpiringSoonPrivate
        # One wildcard certificate serves every private vhost: aggregate so one
        # expiring cert does not emit sixteen identical alerts.
        expr: min(probe_ssl_earliest_cert_expiry{job="blackbox-private"}) > 0 and min(probe_ssl_earliest_cert_expiry{job="blackbox-private"}) - time() < 14 * 24 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Certificat privé bientôt expiré"
          description: "Le wildcard *.h.malice.biz expire dans {{ $value | humanizeDuration }}."
      - alert: TCPProbeDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Probe TCP en échec: {{ $labels.instance }}"
          description: "Le DNAT public ne répond plus depuis 2 minutes."
      - alert: DiskFillingSoon
        # The dashboard used to project this from a 7 d slope and keep it
        # silent. Same window here, but with a paging path.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"}[7d], 7 * 24 * 3600) < 0
          and on (instance, mountpoint, device)
          max by (instance, mountpoint, device) (
            100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"})
          ) > 60
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Disque bientôt plein: {{ $labels.mountpoint }}"
          description: "La projection à 7 jours de l'espace libre est négative."
      - alert: DiskUsageHigh
        expr: |
          max by (instance, mountpoint) (
            100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"})
          ) > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Disque > 85%: {{ $labels.mountpoint }}"
          description: "Le filesystem {{ $labels.mountpoint }} sur {{ $labels.instance }} dépasse 85% depuis 10 minutes ({{ $value | humanizePercentage }} utilisés)."
      # Per host: a fresh malice marker must never mask a stale chill marker.
      - alert: BackupStale
        expr: time() - max by (host, source) (homelab_backup_last_success_timestamp_seconds) > 48 * 3600
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Sauvegarde restic > 48h: {{ $labels.host }}"
          description: "La source {{ $labels.source }} sur {{ $labels.host }} n'a pas reussi depuis plus de 48h."
      - alert: BackupMetricMissing
        expr: absent(homelab_backup_last_success_timestamp_seconds{host="chill-01"}) or absent(homelab_backup_last_success_timestamp_seconds{host="malice"})
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Métrique de sauvegarde absente"
          description: "homelab_backup_last_success_timestamp_seconds manque pour un hôte: le marqueur ou le collecteur textfile est cassé."
      # Job guard: every timer homelab-metrics can see. A timer that stopped
      # firing, a failed unit and a passed deadline are three different breaks.
      - alert: HomelabJobFailed
        expr: homelab_job_failed == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Tâche en échec: {{ $labels.task }} sur {{ $labels.host }}"
          description: "Le dernier run de {{ $labels.task }} a échoué (code {{ $labels.exit_code }})."
      - alert: HomelabJobMissed
        expr: homelab_job_missed == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Tâche en retard: {{ $labels.task }} sur {{ $labels.host }}"
          description: "Le timer est actif mais son échéance est passée de plus de 15 minutes."
      - alert: HomelabJobTimerInactive
        expr: homelab_job_timer_active == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Timer inactif: {{ $labels.task }} sur {{ $labels.host }}"
          description: "Le timer n'est plus armé: la tâche ne tournera plus jusqu'à réactivation."
      - alert: HomelabJobMetricsMissing
        expr: absent(homelab_job_failed{host="chill-01"}) or absent(homelab_job_failed{host="malice"})
        for: 1h
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Métriques de tâches absentes"
          description: "Aucun homelab_job_* pour un hôte: homelab-metrics.timer ou le textfile collector est cassé."
      - alert: BackupRepositoryStale
        expr: time() - max by (host, repository) (homelab_backup_latest_snapshot_timestamp_seconds) > 48 * 3600
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Dépôt restic périmé: {{ $labels.repository }} sur {{ $labels.host }}"
          description: "Le snapshot le plus récent du dépôt a plus de 48h."
      - alert: BackupStatsFailing
        expr: homelab_backup_stats_success == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Stats restic en échec: {{ $labels.repository }} sur {{ $labels.host }}"
          description: "restic snapshots/stats échoue; le marqueur de sauvegarde peut rester frais."
      - alert: BackupStatsStale
        expr: time() - homelab_backup_stats_timestamp_seconds > 12 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Stats restic périmées: {{ $labels.repository }} sur {{ $labels.host }}"
          description: "Aucun rafraîchissement depuis plus de 12h."
      - alert: BackupRepositoryEmpty
        expr: homelab_backup_snapshot_count == 0
        for: 1h
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Dépôt restic vide: {{ $labels.repository }} sur {{ $labels.host }}"
          description: "Le dépôt ne contient aucun snapshot."
      - alert: WireGuardHandshakeStale
        expr: time() - homelab_wireguard_latest_handshake_seconds > 600
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Handshake WireGuard > 10 minutes"
          description: "Le peer {{ $labels.peer }} n'a pas effectué de handshake WireGuard depuis {{ $value | humanizeDuration }}."
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Conteneur redémarré plusieurs fois: {{ $labels.name }}"
          description: "Le conteneur {{ $labels.name }} a redémarré {{ $value | printf \"%.0f\" }} fois en 15 minutes."
      # The hypervisor has 32 GiB total; below ~3 GiB it starts reclaiming
      # cache aggressively and the VMs on it get jittery. Alert before the
      # host is forced to make the choice.
      - alert: HypervisorMemoryLow
        expr: (node_memory_MemAvailable_bytes{job="malice"} / node_memory_MemTotal_bytes{job="malice"}) < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Mémoire hyperviseur < 10%"
          description: "Il reste {{ $value | humanizePercentage }} de mémoire disponible sur malice."
      # Swap-in means the host is under real pressure: pages were already
      # evicted, so latency is degrading even if MemAvailable looks fine.
      - alert: HypervisorSwapIn
        expr: rate(node_vmstat_pswpin{job="malice"}[5m]) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Swap entrant actif sur malice"
          description: "{{ $value | printf \"%.0f\" }} pages/s récupérées du swap depuis 10 minutes."
      # --- Delivery pipeline self-monitoring --------------------------------
      # The bridge exports cumulative counters as GaugeValue. alerts_invalid is
      # only incremented with --debug, so detect dropped alerts as the gap
      # between received and (processed + failed) instead.
      - alert: AlertmanagerBridgeDroppingAlerts
        expr: |
          increase(alertmanager_gotify_bridge_alerts_received[15m])
            - increase(alertmanager_gotify_bridge_alerts_processed[15m])
            - increase(alertmanager_gotify_bridge_alerts_failed[15m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Pont Alertmanager: alertes non livrées"
          description: "{{ $value | printf \"%.0f\" }} alertes reçues n'ont été ni livrées à Gotify ni comptées en échec (annotations manquantes ou payload invalide)."
      - alert: AlertmanagerBridgeDispatchFailing
        expr: increase(alertmanager_gotify_bridge_alerts_failed[15m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Pont Alertmanager: échecs d'envoi vers Gotify"
          description: "{{ $value | printf \"%.0f\" }} alertes n'ont pas pu être postées à Gotify ces 15 dernières minutes."
      - alert: GotifyUnhealthy
        expr: alertmanager_gotify_bridge_gotify_up == 0 or alertmanager_gotify_bridge_gotify_health_health == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Gotify indisponible ou dégradé"
          description: "Le bridge ne joint pas /health de Gotify, ou son état n'est pas green: aucune alerte ne peut être livrée."
      # Local watchdog: host/alert-path-check.sh verifies the whole chain every
      # five minutes independently of Prometheus and writes this textfile
      # gauge. It also fails a systemd unit (OnFailure=notify@), so a dead
      # pipeline is still reported through the direct Gotify path.
      - alert: AlertPipelineDown
        expr: homelab_alert_path_healthy == 0 or absent(homelab_alert_path_healthy)
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Chaîne de notification locale en échec"
          description: "Le contrôle local signale un composant Prometheus/Alertmanager/bridge/Gotify en échec, ou le collecteur a disparu."
