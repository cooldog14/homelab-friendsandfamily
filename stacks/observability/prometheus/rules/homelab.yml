# Delivery contract for alertmanager-gotify-bridge:2.3.2 (see
# stacks/observability/docker-compose.yml). The bridge builds a Gotify message
# from the `summary` and `description` ANNOTATIONS and reads Gotify priority
# from a numeric `priority` annotation (strconv.Atoi); it does NOT read the
# `severity` label. Every rule therefore needs all three annotations, and
# `host/check-alert-rules.py` enforces that contract in `make check`.
# critical -> priority 8, warning -> priority 5 (the bridge default).
groups:
  - name: homelab
    rules:
      - alert: HostDown
        expr: up{job=~"node|malice"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Host metrics unavailable: {{ $labels.instance }}"
          description: "Prometheus cannot scrape the host's node exporter."
      - alert: ContainerOOMKilled
        expr: sum by (name) (increase(container_oom_events_total[1h])) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Container out of memory: {{ $labels.name }}"
          description: "The kernel killed the container at least once in the past hour."
      - alert: ContainerOOMMetricsMissing
        expr: absent(container_oom_events_total)
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Container OOM counters missing"
          description: "The container_oom_events_total series is absent, so the existing OOM rules cannot detect container OOM events."
      - alert: KernelOOMKill
        expr: increase(node_vmstat_oom_kill[1h]) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Kernel out-of-memory kill: {{ $labels.instance }}"
          description: "The kernel recorded at least one out-of-memory kill in the past hour."
      - alert: TargetDown
        expr: up{job=~"prometheus|alertmanager|grafana|cadvisor|blackbox|gotify-bridge|dashboard"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Prometheus target unavailable: {{ $labels.job }}"
          description: "Prometheus cannot scrape {{ $labels.instance }}."
      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Public endpoint check failed: {{ $labels.instance }}"
          description: "The public HTTPS probe failed."
      - alert: TLSCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} > 0 and probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 14 * 24 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Certificate expiring soon: {{ $labels.instance }}"
          description: "The public certificate has less than 14 days left."
      - alert: PrivateEndpointDown
        expr: probe_success{job="blackbox-private"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Private endpoint check failed: {{ $labels.instance }}"
          description: "The private HTTPS probe failed. Check Caddy and its upstream."
      - alert: TLSCertExpiringSoonPrivate
        # One wildcard certificate serves every private vhost: aggregate so one
        # expiring cert does not emit sixteen identical alerts.
        expr: min(probe_ssl_earliest_cert_expiry{job="blackbox-private"}) > 0 and min(probe_ssl_earliest_cert_expiry{job="blackbox-private"}) - time() < 14 * 24 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Private certificate expiring soon"
          description: "The wildcard certificate for *.h.malice.biz has less than 14 days left."
      - alert: TCPProbeDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Public TCP check failed: {{ $labels.instance }}"
          description: "The forwarded port did not accept a TCP connection."
      - alert: DiskFillingSoon
        # The dashboard used to project this from a 7 d slope and keep it
        # silent. Same window here, but with a paging path.
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"}[7d], 7 * 24 * 3600) < 0
          and on (instance, mountpoint, device)
          max by (instance, mountpoint, device) (
            100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs|fuse.*"})
          ) > 60
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Disk may fill within 7 days: {{ $labels.mountpoint }}"
          description: "At the recent rate, the filesystem on {{ $labels.instance }} could run out of space."
      - alert: DiskUsageHigh
        expr: |
          max by (instance, mountpoint) (
            100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|autofs"})
          ) > 85
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Disk usage above 85%: {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.1f\" }}% full."
      # Per host: a fresh malice marker must never mask a stale chill marker.
      - alert: BackupStale
        expr: time() - max by (host, source) (homelab_backup_last_success_timestamp_seconds) > 48 * 3600
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Backup older than 48 hours: {{ $labels.host }}"
          description: "The {{ $labels.source }} backup on {{ $labels.host }} has not succeeded in over 48 hours."
      - alert: BackupMetricMissing
        expr: absent(homelab_backup_last_success_timestamp_seconds{host="chill-01"}) or absent(homelab_backup_last_success_timestamp_seconds{host="malice"})
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Backup metric missing"
          description: "homelab_backup_last_success_timestamp_seconds is missing for a host. Check the backup marker and textfile collector."
      # Job guard: every timer homelab-metrics can see. A timer that stopped
      # firing, a failed unit and a passed deadline are three different breaks.
      - alert: HomelabJobFailed
        expr: homelab_job_failed == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Job failed: {{ $labels.task }} on {{ $labels.host }}"
          description: "The last run failed. Check homelab_job_last_exit_code and the service journal."
      - alert: HomelabJobMissed
        expr: homelab_job_missed == 1
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Job overdue: {{ $labels.task }} on {{ $labels.host }}"
          description: "The timer is active but missed its scheduled run by more than 15 minutes."
      - alert: HomelabJobTimerInactive
        expr: homelab_job_timer_active == 0
        for: 15m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Timer inactive: {{ $labels.task }} on {{ $labels.host }}"
          description: "The timer is no longer armed. The job will not run on schedule until it is reactivated."
      - alert: HomelabJobMetricsMissing
        expr: absent(homelab_job_failed{host="chill-01"}) or absent(homelab_job_failed{host="malice"})
        for: 1h
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Job metrics missing"
          description: "Job metrics are missing for a host. Check homelab-metrics.timer and the textfile collector."
      - alert: BackupRepositoryStale
        expr: time() - max by (host, repository) (homelab_backup_latest_snapshot_timestamp_seconds) > 48 * 3600
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Restic repository stale: {{ $labels.repository }} on {{ $labels.host }}"
          description: "The most recent snapshot is older than 48 hours."
      - alert: BackupStatsFailing
        expr: homelab_backup_stats_success == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Restic stats collection failed: {{ $labels.repository }} on {{ $labels.host }}"
          description: "Restic could not collect snapshot statistics. The backup marker may still be current."
      - alert: BackupStatsStale
        expr: time() - homelab_backup_stats_timestamp_seconds > 12 * 3600
        for: 1h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Restic stats stale: {{ $labels.repository }} on {{ $labels.host }}"
          description: "The stats have not been refreshed in over 12 hours."
      - alert: BackupRepositoryEmpty
        expr: homelab_backup_snapshot_count == 0
        for: 1h
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Restic repository empty: {{ $labels.repository }} on {{ $labels.host }}"
          description: "The repository contains no snapshots."
      - alert: WireGuardHandshakeStale
        expr: time() - homelab_wireguard_latest_handshake_seconds > 600
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "WireGuard handshake older than 10 minutes"
          description: "The last handshake for peer {{ $labels.peer }} was {{ $value | humanizeDuration }} ago."
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Repeated container restarts: {{ $labels.name }}"
          description: "The container restarted {{ $value | printf \"%.0f\" }} times in the past 15 minutes."
      # The hypervisor has 32 GiB total; below ~3 GiB it starts reclaiming
      # cache aggressively and the VMs on it get jittery. Alert before the
      # host is forced to make the choice.
      - alert: HypervisorMemoryLow
        expr: (node_memory_MemAvailable_bytes{job="malice"} / node_memory_MemTotal_bytes{job="malice"}) < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Malice memory below 10%"
          description: "{{ $value | humanizePercentage }} of RAM is available on malice."
      # Swap-in means the host is under real pressure: pages were already
      # evicted, so latency is degrading even if MemAvailable looks fine.
      - alert: HypervisorSwapIn
        expr: rate(node_vmstat_pswpin{job="malice"}[5m]) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Swap reads on malice"
          description: "Swap-in is {{ $value | printf \"%.3f\" }} pages/s on average over 5 minutes. The alert fires if that rate stays above zero for 10 minutes."
      # --- Delivery pipeline self-monitoring --------------------------------
      # The bridge exports cumulative counters as GaugeValue. alerts_invalid is
      # only incremented with --debug, so detect dropped alerts as the gap
      # between received and (processed + failed) instead.
      - alert: AlertmanagerBridgeDroppingAlerts
        expr: |
          increase(alertmanager_gotify_bridge_alerts_received[15m])
            - increase(alertmanager_gotify_bridge_alerts_processed[15m])
            - increase(alertmanager_gotify_bridge_alerts_failed[15m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Alertmanager bridge dropped alerts"
          description: "{{ $value | printf \"%.0f\" }} alerts were neither delivered to Gotify nor counted as failures in the past 15 minutes. Check annotations and payloads."
      - alert: AlertmanagerBridgeDispatchFailing
        expr: increase(alertmanager_gotify_bridge_alerts_failed[15m]) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Alertmanager bridge could not send alerts"
          description: "The bridge failed to send {{ $value | printf \"%.0f\" }} alerts to Gotify in the past 15 minutes."
      - alert: GotifyUnhealthy
        expr: alertmanager_gotify_bridge_gotify_up == 0 or alertmanager_gotify_bridge_gotify_health_health == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Gotify unavailable or unhealthy"
          description: "The bridge cannot reach Gotify's health endpoint, or the endpoint reports an unhealthy status."
      # Local watchdog: host/alert-path-check.sh verifies the whole chain every
      # five minutes independently of Prometheus and writes this textfile
      # gauge. It also fails a systemd unit (OnFailure=notify@), so a dead
      # pipeline is still reported through the direct Gotify path.
      - alert: AlertPipelineDown
        expr: homelab_alert_path_healthy == 0 or absent(homelab_alert_path_healthy)
        for: 10m
        labels: {severity: critical}
        annotations:
          priority: "8"
          summary: "Local notification path unhealthy"
          description: "A component of the notification path is unhealthy, or its health metrics are missing."
      - alert: ApplicationUnhealthy
        expr: homelab_app_healthy == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Application unhealthy: {{ $labels.app }}"
          description: "The app is not passing its API or container health check."
      - alert: ApplicationHealthStale
        expr: |
          time() - homelab_app_check_timestamp_seconds > 300
          or absent(homelab_app_check_timestamp_seconds{app="jellyseerr"})
          or absent(homelab_app_check_timestamp_seconds{app="radarr"})
          or absent(homelab_app_check_timestamp_seconds{app="sonarr"})
          or absent(homelab_app_check_timestamp_seconds{app="bazarr"})
          or absent(homelab_app_check_timestamp_seconds{app="navidrome"})
          or absent(homelab_app_check_timestamp_seconds{app="caddy"})
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Application health stale: {{ $labels.app }}"
          description: "An expected application health check is missing or more than five minutes old."
      - alert: ArrHealthIssues
        expr: homelab_arr_health_issues > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Arr health issues: {{ $labels.app }}"
          description: "The application reports one or more warnings or errors."
      - alert: ArrImportBlockedTooLong
        expr: homelab_arr_queue_import_blocked == 1
        for: 24h
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Import waiting: {{ $labels.app }}"
          description: "Queue item {{ $labels.queue_id }} is pending or blocked. The alert fires if it stays pending or blocked for 24 hours."
      - alert: ArrQueueCheckFailed
        expr: homelab_arr_queue_check_success == 0 or absent(homelab_arr_queue_check_success{app="radarr"}) or absent(homelab_arr_queue_check_success{app="sonarr"})
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Arr queue check failed: {{ $labels.app }}"
          description: "Complete queue collection failed or an expected success series is missing."
      - alert: ArrQueueCheckStale
        expr: time() - homelab_arr_queue_check_timestamp_seconds > 300 or absent(homelab_arr_queue_check_timestamp_seconds{app="radarr"}) or absent(homelab_arr_queue_check_timestamp_seconds{app="sonarr"})
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Arr queue check stale: {{ $labels.app }}"
          description: "An expected complete queue collection is missing or more than five minutes old."
      - alert: ExecutableDownloadPayload
        expr: homelab_download_executable_files > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Executable payload in downloads"
          description: "Executable suffixes or headers were found; inspect escaped paths in the payload scanner journal. Nothing was deleted."
      - alert: DownloadPayloadScanFailed
        expr: homelab_download_payload_scan_success == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Download payload scan failed"
          description: "A root is missing or a permission/I/O failure prevents a complete scan; no reassuring zero is published."
      - alert: DownloadPayloadScanStale
        expr: time() - homelab_download_payload_scan_timestamp_seconds > 900 or absent(homelab_download_payload_scan_timestamp_seconds) or absent(homelab_download_payload_scan_success)
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Download payload scan stale or missing"
          description: "The download payload scan timestamp is missing or older than fifteen minutes."
      - alert: WireGuardCollectionFailed
        expr: homelab_wireguard_collect_success{host="chill-01",interface="wg0"} == 0 or homelab_wireguard_peer_count{host="chill-01",interface="wg0"} == 0 or absent(homelab_wireguard_collect_success{host="chill-01",interface="wg0"}) or absent(homelab_wireguard_peer_count{host="chill-01",interface="wg0"}) or absent(homelab_wireguard_latest_handshake_seconds{host="chill-01",interface="wg0"})
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "WireGuard runtime collection missing or failed"
          description: "chill-01 wg0 has no observed peers, a failed runtime query, or missing expected metrics."
      - alert: SystemdFailedUnits
        expr: homelab_systemd_failed_units > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Failed systemd units: {{ $labels.host }}"
          description: "At least one systemd unit is failed; inspect systemctl --failed and its journal."
      - alert: SystemdCollectionFailed
        expr: homelab_systemd_collect_success == 0 or absent(homelab_systemd_collect_success{host="chill-01"}) or absent(homelab_systemd_collect_success{host="malice"})
        for: 10m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Systemd collection failed: {{ $labels.host }}"
          description: "The failed-unit collector returned an error or the expected host series is missing."
      - alert: HostMetricsStale
        expr: time() - homelab_metrics_timestamp_seconds > 900 or absent(homelab_metrics_timestamp_seconds{host="chill-01"}) or absent(homelab_metrics_timestamp_seconds{host="malice"})
        for: 5m
        labels: {severity: warning}
        annotations:
          priority: "5"
          summary: "Host textfile metrics stale: {{ $labels.host }}"
          description: "The host metric timestamp is missing or older than fifteen minutes."
