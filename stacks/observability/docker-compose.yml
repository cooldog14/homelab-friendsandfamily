services:
  gotify:
    image: gotify/server:3.1.1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      default:
      homelab-edge:
        aliases: [gotify]
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS}
    volumes:
      - ./state/gotify:/app/data

  # Prometheus + Alertmanager + Grafana own host and per-container metrics.
  # Gotify stays the delivery path: Prometheus scrapes, Alertmanager routes,
  # and the bridge below turns alert payloads into Gotify messages.
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    # Loopback only: the query API stays on the box. Grafana talks to it over
    # the compose network, never over a published port. Port 9091, not 9090:
    # Cockpit's socket owns *:9090 on the host.
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./state/prometheus:/prometheus
    mem_limit: 1g

  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./state/alertmanager:/alertmanager
    mem_limit: 128m

  # Translates the Alertmanager webhook payload into Gotify's API. Internal
  # only: no published port, reached by service name from Alertmanager.
  alertmanager-gotify-bridge:
    image: ghcr.io/druggeri/alertmanager_gotify_bridge:2.3.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    environment:
      GOTIFY_ENDPOINT: http://gotify:80/message
      GOTIFY_TOKEN: ${GOTIFY_ALERTMANAGER_TOKEN:?set GOTIFY_ALERTMANAGER_TOKEN in .env}
      BIND_ADDRESS: 0.0.0.0
      PORT: 8080
      WEBHOOK_PATH: /gotify_webhook
      DEFAULT_PRIORITY: 5
      EXTENDED_DETAILS: "true"
    mem_limit: 64m

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/textfile:ro
    mem_limit: 128m

  # cAdvisor is the ONE privileged container in this stack: it reads cgroup
  # accounting and /dev/kmsg, which no unprivileged process can do. It publishes
  # nothing (Prometheus scrapes it inside the compose network).
  cadvisor:
    # cAdvisor publishes v0.60.x to ghcr.io; gcr.io stops at v0.55.1.
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 1g

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "65534:65534"
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    mem_limit: 128m

  # Read-only admin view of the whole homelab. Joins the internal edge network
  # so private Caddy can proxy home.h.malice.biz here; publishes nothing.
  # It reads Docker/Tailscale/Prometheus/Compose and exposes one JSON snapshot.
  # Root is required to open the Docker socket; the process issues GETs only.
  dashboard:
    build: ./dashboard
    image: homelab-dashboard:local
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    environment:
      TZ: Europe/Paris
      PROMETHEUS_URL: http://prometheus:9090
      DOCKER_SOCKET: /var/run/docker.sock
      TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
      STACKS_ROOT: /opt/stacks
      PUBLIC_CADDY_DIR: /usr/local/share/homelab-public-sites
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${DASHBOARD_JELLYFIN_API_KEY:-}
      JELLYSEERR_URL: http://jellyseerr:5055
      JELLYSEERR_API_KEY: ${DASHBOARD_JELLYSEERR_API_KEY:-}
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_API_KEY: ${DASHBOARD_PROWLARR_API_KEY:-}
      SONARR_URL: http://sonarr:8989
      SONARR_API_KEY: ${DASHBOARD_SONARR_API_KEY:-}
      RADARR_URL: http://radarr:7878
      RADARR_API_KEY: ${DASHBOARD_RADARR_API_KEY:-}
    volumes:
      # Read-only mounts; a stopped tailscaled leaves a directory, not a stale
      # file, so the mount cannot wedge container start.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/tailscale:/var/run/tailscale:ro
      - /opt/stacks:/opt/stacks:ro
      - /usr/local/share/homelab-public-sites:/usr/local/share/homelab-public-sites:ro
    networks:
      default:
      homelab-edge:
        aliases: [dashboard]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "472:472"
    networks:
      default:
      homelab-edge:
        aliases: [grafana]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://grafana.h.malice.biz
      GF_SERVER_DOMAIN: grafana.h.malice.biz
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./state/grafana:/var/lib/grafana
    mem_limit: 1g

networks:
  homelab-edge:
    external: true
    name: homelab-edge
