services:
  # File manager over /mnt/data. Bulk media surfaces under /srv/pool.
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:1.5.6-stable
    restart: unless-stopped
    ports:
      - "10.44.0.2:8085:80"
    volumes:
      - /mnt/data:/srv
      - /mnt/pool:/srv/pool
      - ./state/filebrowser-quantum:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro

  # Public music uploader: /srv is only the music inbox.
  filebrowser-upload:
    image: ghcr.io/gtsteffaniak/filebrowser:1.5.6-stable
    restart: unless-stopped
    ports:
      - "10.44.0.2:8087:80"
    volumes:
      - /mnt/data/media/music/inbox/user:/srv
      - ./state/filebrowser-upload:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro

  # Public family files: scoped to one important-data folder, not all /mnt/data.
  filebrowser-family:
    image: ghcr.io/gtsteffaniak/filebrowser:1.5.6-stable
    restart: unless-stopped
    ports:
      - "10.44.0.2:8086:80"
    volumes:
      - /mnt/data/family:/srv
      - ./state/filebrowser-family:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro
