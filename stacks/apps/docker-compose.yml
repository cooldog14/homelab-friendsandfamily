services:
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      default:
      homelab-edge:
        aliases: [filebrowser]
    volumes:
      - /mnt/data/archive:/srv/archive:rw
      - /mnt/data/docs:/srv/docs:rw
      - /mnt/data/family:/srv/family:rw
      - /mnt/data/shared:/srv/shared:rw
      - /mnt/data/users:/srv/users:rw
      - /mnt/data/media:/srv/media:rw
      - /mnt/data/photos:/srv/photos:rw
      - /mnt/data/downloads:/srv/downloads:rw
      - /mnt/pool/media:/srv/pool/media:rw
      - /mnt/pool/downloads:/srv/pool/downloads:rw
      - ./state/filebrowser-quantum:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro

  filebrowser-upload:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "10.44.0.2:8087:80"
    volumes:
      - /mnt/data/media/music/inbox/user:/srv
      - ./state/filebrowser-upload:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro

  filebrowser-family:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "10.44.0.2:8086:80"
    volumes:
      - /mnt/data/family:/srv
      - ./state/filebrowser-family:/home/filebrowser/data
      - ./config/filebrowser/config.yaml:/home/filebrowser/data/config.yaml:ro

networks:
  homelab-edge:
    external: true
    name: homelab-edge
