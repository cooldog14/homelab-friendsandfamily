# FileBrowser Quantum. Schema is the v1.5.x one (upstream backend/config.yaml at
# tag v1.5.6-stable); the 2.0 line rearranged this, so re-read the docs before
# bumping the image across that boundary.
# An admin user is created on first start and its password is printed to the
# container log once — read it from Dockge and change it immediately.
server:
  port: 80
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  # /mnt/fast, /mnt/archive and /mnt/pool are bind-mounted underneath /srv in the
  # compose file, so this single source already covers every disk.
  sources:
    - path: "/srv"
auth:
  methods:
    password:
      enabled: true
      # Upstream default is 5. This is reachable over the tailnet by anyone with a
      # device on it, so it gets a real minimum.
      minLength: 12
      signup: false
    passkey:
      enabled: false
