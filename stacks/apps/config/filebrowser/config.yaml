# Filebrowser Quantum 2.x config (migrated 2026-11-03: port/baseURL moved
# server.* -> http.*, logging apiFilter added). Behind VPS/edge Caddy.
http:
  port: 80
  baseURL: "/"
server:
  logging:
    - levels: "info|warning|error"
      apiFilter: "disabled"
  sources:
    - path: "/srv"
auth:
  methods:
    password:
      enabled: true
      # Upstream default is 5. These services are reachable wherever routed, so
      # they get a real minimum.
      minLength: 12
      signup: false
    passkey:
      enabled: true
