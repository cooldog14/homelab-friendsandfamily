# Private front door on the tailnet: HTTPS and real names for the services that
# were bare http://10.44.0.2:<port> URLs before. Nothing here is public — the VPS
# Caddy still owns every *.malice.biz vhost, and this file must never duplicate one.
# Binds ONLY to the Tailscale address, so reaching it needs a tailnet device.
# .env (0600, live-only, never in git): TS_IP, CF_API_TOKEN, UPSTREAM
services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4-alpine
    restart: unless-stopped
    ports:
      # Default is 127.0.0.1, not empty and not 0.0.0.0: a missing .env must
      # fail CLOSED. Empty would render ":443:443" and bind every interface
      # (LAN included, since docker publishes past ufw). The localhost default
      # also keeps `make check` working on a clone with no .env.
      - "${TS_IP:-127.0.0.1}:443:443"
      # :80 is only Caddy's http->https redirect. Without it, typing a bare
      # hostname gets connection-refused instead of bouncing to TLS.
      - "${TS_IP:-127.0.0.1}:80:80"
    environment:
      # DNS-01 only, so no inbound port is ever needed. Token is scoped to
      # Zone:DNS:Edit on malice.biz and nothing else. Unset means no cert,
      # which is loud and harmless — not a wide-open listener.
      CF_API_TOKEN: ${CF_API_TOKEN:-unset}
      # Where Caddy proxies to. Stays 10.44.0.2 because WireGuard is the
      # infrastructure link between VPS and chill-01.
      UPSTREAM: ${UPSTREAM:-10.44.0.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./home:/srv/home:ro
      - ./state/home:/srv/status:ro
      # Holds the wildcard cert + ACME account key. Losing it re-issues on next
      # boot (rate limits permitting); it is not a peer database, so it is not sacred.
      - ./state/caddy:/data
