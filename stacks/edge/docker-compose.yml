# Private front door on the tailnet: HTTPS and real names for the services that
# were bare http://10.44.0.2:<port> URLs before. Nothing here is public — the VPS
# Caddy still owns every *.malice.biz vhost, and this file must never duplicate one.
# Binds ONLY to the Tailscale address, so reaching it needs a tailnet device.
# .env (0600, live-only, never in git): TS_IP, CF_API_TOKEN
services:
  caddy:
    image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4-alpine
    restart: unless-stopped
    extra_hosts:
      # Lets private Caddy reach host services like Cockpit without exposing
      # them on the public VPS WireGuard path.
      - host.docker.internal:host-gateway
    ports:
      # Localhost default fails closed when .env is missing.
      - "${TS_IP:-127.0.0.1}:443:443"
      - "${TS_IP:-127.0.0.1}:80:80"
    environment:
      # DNS-01 token; unset fails cert issuance without widening listeners.
      CF_API_TOKEN: ${CF_API_TOKEN:-unset}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./home:/srv/home:ro
      # Holds the wildcard cert + ACME account key. Losing it re-issues on next
      # boot (rate limits permitting); it is not a peer database, so it is not sacred.
      - ./state/caddy:/data

# Pinned so bootstrap.sh can narrow the 172.16/12→9090 Cockpit rule to this
# subnet only (edge Caddy is the sole legitimate 9090 client). Do not change
# without updating bootstrap.sh DOCKER-USER + UFW rules.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
