---
# VPS public edge: Caddy + nftables + the static WireGuard tunnel into the app VM.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Caddy and CrowdSec come from their own repositories. Without these a clean
# rebuild falls back to Debian's Caddy 2.6.2 and has no CrowdSec upgrade path,
# so the codified edge would be older and weaker than the live one.
- name: Install repository and ACL prerequisites
  ansible.builtin.apt:
    name:
      - acl
      - ca-certificates
      - curl
      - gnupg
    state: present

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch the Caddy signing key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /tmp/caddy-cloudsmith.gpg.key
    mode: "0644"
    force: false

- name: Dearmor the Caddy signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /usr/share/keyrings/caddy-stable-archive-keyring.gpg /tmp/caddy-cloudsmith.gpg.key
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add the Caddy apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/caddy-stable.list
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
  register: vps_edge_caddy_repo

- name: Fetch the CrowdSec signing key
  ansible.builtin.get_url:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    dest: /tmp/crowdsec-packagecloud.gpg.key
    mode: "0644"
    force: false

- name: Dearmor the CrowdSec signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg /tmp/crowdsec-packagecloud.gpg.key
    creates: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg

# packagecloud publishes one 'any' suite for CrowdSec; a codename such as
# 'trixie' has no Release file and makes apt refuse the whole cache refresh.
- name: Add the CrowdSec apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any/ any main
  register: vps_edge_crowdsec_repo

# A new repo is invisible to a cache refreshed earlier in this play, so refresh
# again whenever a list file was written.
- name: Refresh the apt cache after adding repositories
  ansible.builtin.apt:
    update_cache: true
  when: vps_edge_caddy_repo.changed or vps_edge_crowdsec_repo.changed

- name: Check whether CrowdSec is already installed
  ansible.builtin.stat:
    path: /etc/crowdsec/config.yaml
  register: vps_edge_cs_config

- name: Look for an earlier CrowdSec configuration backup
  ansible.builtin.find:
    paths: /root
    patterns: "crowdsec-pre-upgrade-*.tar.gz"
  register: vps_edge_cs_backups

# /etc/crowdsec carries the bouncer API key: archive it 0600 before the first
# package jump, and never overwrite the oldest copy on later runs.
- name: Record the CrowdSec configuration before any package change
  ansible.builtin.shell: |
    set -eu
    umask 077
    tar -czf "/root/crowdsec-pre-upgrade-{{ ansible_date_time.iso8601_basic_short }}.tar.gz" -C / etc/crowdsec
  when:
    - vps_edge_cs_config.stat.exists
    - vps_edge_cs_backups.matched == 0

- name: Install edge packages
  ansible.builtin.apt:
    name:
      - nftables
      - unattended-upgrades
      - wireguard
    state: present

# The nftables build is the one packagecloud ships at a current version; the
# distro package it replaces is the 0.0.25 iptables-era build still installed
# here. Removing it first keeps one bouncer binary and one unit.
- name: Remove the superseded distro firewall bouncer
  ansible.builtin.apt:
    name: crowdsec-firewall-bouncer
    state: absent

# `latest` is deliberate: this is the only tracked path to a supported Caddy
# and CrowdSec, and both fix security issues rather than features. The notify is
# required: dpkg replaced the binary without restarting the running engine, so
# the old process kept serving the new config from memory.
- name: Install Caddy and CrowdSec from their own repositories
  ansible.builtin.apt:
    name:
      - caddy
      - crowdsec
      - crowdsec-firewall-bouncer-nftables
    state: latest
  notify: crowdsec config changed

# 4522 is internet-exposed: a password there is a brute-force target. The
# drop-in sorts before sshd_config and OpenSSH uses the first value it reads.
- name: Harden the public SSH daemon
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab-hardening.conf
    mode: "0644"
    content: |
      # Homelab: key-only. Root may log in with a key, never a password.
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  notify: Validate and reload ssh

- name: Create the Caddy log directory
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

# The log files must exist caddy-owned BEFORE validate/reload: `caddy validate`
# runs as root and would create them root-owned, which then breaks the reload
# running as caddy.
- name: Create the Caddy log files
  ansible.builtin.file:
    path: "/var/log/caddy/{{ item }}"
    state: touch
    owner: caddy
    group: caddy
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  loop:
    - caddy.log
    - access.log

# The Debian CrowdSec package runs the engine as root, so it already reads the
# 0600 caddy-owned log. Apply ACLs only if that ever changes to a dedicated
# user; either way the assertion below is what proves acquisition can work.
- name: Read the user the CrowdSec engine runs as
  ansible.builtin.command:
    cmd: systemctl show crowdsec -p User --value
  register: vps_edge_cs_user
  changed_when: false

- name: Let CrowdSec read the current Caddy access log
  ansible.posix.acl:
    path: /var/log/caddy/access.log
    entity: "{{ vps_edge_cs_user.stdout | trim }}"
    etype: user
    permissions: r
    state: present
  when: vps_edge_cs_user.stdout | trim not in ['', 'root']

- name: Default ACL so rotated and new Caddy logs stay readable
  ansible.posix.acl:
    path: /var/log/caddy
    entity: "{{ vps_edge_cs_user.stdout | trim }}"
    etype: user
    permissions: r
    default: true
    state: present
  when: vps_edge_cs_user.stdout | trim not in ['', 'root']

- name: Verify the CrowdSec engine can read the Caddy access log
  ansible.builtin.command:
    cmd: "runuser -u {{ vps_edge_cs_user.stdout | trim or 'root' }} -- test -r /var/log/caddy/access.log"
  changed_when: false

# Only the two log sources this edge actually has: Caddy HTTP and sshd. The
# nginx/apache paths in the shipped file point at servers that do not exist.
- name: Install the CrowdSec acquisition configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/crowdsec/acquis.yaml"
    dest: /etc/crowdsec/acquis.yaml
    mode: "0644"
  notify: crowdsec config changed

# The package ships INPUT only. The edge forwards into the app VM, so a banned
# scanner must be dropped on the forward path too, not just on the host itself.
- name: Enable the CrowdSec firewall hooks
  ansible.builtin.blockinfile:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    marker: "# {mark} HOMELAB HOOKS"
    insertafter: EOF
    block: |
      nftables_hooks:
        - input
        - forward
  notify: crowdsec config changed

# CrowdSec 1.8 ships the hub as an index plus per-item downloads. Upgrading
# from the 1.4 tree left /etc/crowdsec full of symlinks into content that was
# never fetched, so parsers and scenarios were skipped while the engine still
# reported healthy. Dangling links go, then the content is installed below.
- name: Find CrowdSec hub symlinks with no target
  ansible.builtin.shell: find /var/lib/crowdsec/hub /etc/crowdsec -xtype l
  register: vps_edge_cs_dangling
  changed_when: false

- name: Remove CrowdSec hub symlinks with no target
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ vps_edge_cs_dangling.stdout_lines }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Read installed CrowdSec collections
  ansible.builtin.command:
    cmd: cscli collections list -o json
  register: vps_edge_cs_collections
  changed_when: false

# The CLI wraps the list in an object on some releases and returns a bare list
# on others; both are normalised here so a CrowdSec upgrade cannot break the run.
- name: Summarise the CrowdSec collection inventory
  ansible.builtin.set_fact:
    vps_edge_cs_items: "{{ vps_edge_cs_parsed['collections'] if vps_edge_cs_parsed is mapping else vps_edge_cs_parsed }}"
  vars:
    vps_edge_cs_parsed: "{{ vps_edge_cs_collections.stdout | from_json }}"

- name: Compute the collection changes
  ansible.builtin.set_fact:
    vps_edge_cs_install: "{{ vps_edge_cs_wanted | reject('in', vps_edge_cs_names) | list }}"
    vps_edge_cs_remove: "{{ ['crowdsecurity/nginx', 'crowdsecurity/apache2'] | select('in', vps_edge_cs_names) | list }}"
  vars:
    vps_edge_cs_wanted:
      - crowdsecurity/linux
      - crowdsecurity/sshd
      - crowdsecurity/base-http-scenarios
      - crowdsecurity/http-cve
      - crowdsecurity/caddy
    vps_edge_cs_names: "{{ vps_edge_cs_items | map(attribute='name') | list }}"

- name: Refresh the CrowdSec hub index
  ansible.builtin.command:
    cmd: cscli hub update
  when: vps_edge_cs_install | length > 0
  changed_when: false

- name: Install the required collections
  ansible.builtin.command:
    cmd: "cscli collections install {{ item }}"
  loop: "{{ vps_edge_cs_install }}"
  notify: crowdsec config changed

- name: Remove the collections for servers this edge does not run
  ansible.builtin.command:
    cmd: "cscli collections remove {{ item }}"
  loop: "{{ vps_edge_cs_remove }}"
  notify: crowdsec config changed

- name: Re-read installed CrowdSec collections
  ansible.builtin.command:
    cmd: cscli collections list -o json
  register: vps_edge_cs_collections_after
  changed_when: false
  when: vps_edge_cs_install | length > 0 or vps_edge_cs_remove | length > 0

- name: Find tainted CrowdSec collections
  ansible.builtin.set_fact:
    vps_edge_cs_tainted: "{{ vps_edge_cs_current | selectattr('tainted', 'defined') | selectattr('tainted') | map(attribute='name') | list }}"
  vars:
    vps_edge_cs_after_parsed: "{{ vps_edge_cs_collections_after.stdout | from_json }}"
    vps_edge_cs_current: "{{ (vps_edge_cs_after_parsed['collections'] if vps_edge_cs_after_parsed is mapping else vps_edge_cs_after_parsed) if vps_edge_cs_collections_after is not skipped else vps_edge_cs_items }}"

# Tainted entries were edited locally and no longer match the hub, so a rule
# fix shipped upstream never lands. --force is what actually overwrites them.
- name: Upgrade tainted collections
  ansible.builtin.command:
    cmd: "cscli collections upgrade --force {{ item }}"
  loop: "{{ vps_edge_cs_tainted }}"
  notify: crowdsec config changed

- name: Install the Caddy entrypoint
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/Caddyfile"
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: caddy config changed

- name: Create the Caddy sites directory
  ansible.builtin.file:
    path: /etc/caddy/sites
    state: directory
    mode: "0755"

- name: Collect the public site names declared in git
  ansible.builtin.set_fact:
    vps_edge_sites_wanted: >-
      {{ query('fileglob', playbook_dir + '/../vps/sites/*.caddy') | map('basename') | list }}

- name: Install the public site files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/sites/{{ item }}"
    dest: "/etc/caddy/sites/{{ item }}"
    mode: "0644"
  loop: "{{ vps_edge_sites_wanted }}"
  loop_control:
    label: "{{ item }}"
  notify: caddy config changed

- name: List installed site files
  ansible.builtin.find:
    paths: /etc/caddy/sites
    patterns: "*.caddy"
  register: vps_edge_sites_installed

- name: Remove site files no longer in git
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ vps_edge_sites_installed.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in vps_edge_sites_wanted
  notify: caddy config changed

# Caddy must not start before the tunnel it proxies into.
- name: Ensure the systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    mode: "0755"

- name: Order Caddy after the WireGuard tunnel
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service.d/homelab.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=wg-quick@chill0.service
      After=wg-quick@chill0.service
  notify: caddy restart

- name: Create the nftables include directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

# homelab_nat is its own table: apply without touching /etc/nftables.conf, which
# carries provider and local rules.
- name: Install the homelab NAT table
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/nftables.conf"
    dest: /etc/nftables.d/homelab_nat.conf
    mode: "0644"
  notify: Apply nftables rules

# The effective filter table is rebuilt atomically from git after the provider
# base file loads. Separate tables (CrowdSec/Docker/NAT) are never flushed.
- name: Install the effective homelab firewall table
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/firewall.nft"
    dest: /etc/nftables.d/homelab_firewall.conf
    mode: "0644"
  notify: Apply nftables rules

# Remove rules superseded by the git-owned table. This prevents a stale broad
# rule from being active between base-table load and the atomic replacement.
- name: Remove legacy broad firewall rules
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^\s*iifname "eth0" oifname "wg0" ct state new accept$'
    - '^\s*iifname "wg0" ip daddr 10\.44\.0\.0/24 accept$'
    - '^\s*ip daddr 10\.44\.0\.0/24 accept$'
    - '^\s*iifname "wg0" oifname "eth0" accept$'
    - '^\s*iifname "br-\*" oifname "eth0" accept$'
    - '^\s*iifname "chill0" tcp dport 8088 accept$'
  notify: Apply nftables rules

# The includes live outside nftables.d, so they cannot be shipped as one file.
- name: Ensure the homelab NAT table is included
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/homelab_nat.conf"'
    insertafter: EOF
    state: present
  notify: Apply nftables rules

- name: Ensure the effective firewall table is included last
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: 'include "/etc/nftables.d/homelab_firewall.conf"'
    insertafter: '^include "/etc/nftables.d/homelab_nat\.conf"$'
    state: present
  notify: Apply nftables rules

# BBR survives policer/shaper loss far better than cubic; fq is its pair.
- name: Set edge sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - {name: net.ipv4.ip_forward, value: "1"}
    - {name: net.core.default_qdisc, value: fq}
    - {name: net.ipv4.tcp_congestion_control, value: bbr}

- name: Load tcp_bbr at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/homelab-bbr.conf
    mode: "0644"
    content: |
      tcp_bbr

- name: Load tcp_bbr now
  community.general.modprobe:
    name: tcp_bbr
    state: present

- name: Schedule unattended-upgrade reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51homelab
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "01:30";

- name: Check the WireGuard config exists
  ansible.builtin.stat:
    path: /etc/wireguard/chill0.conf
  register: vps_edge_wg_conf

- name: Fail when the WireGuard config is missing
  ansible.builtin.fail:
    msg: "écrire /etc/wireguard/chill0.conf avant Ansible"
  when: not vps_edge_wg_conf.stat.exists

- name: Ensure wg-quick@chill0 is enabled and running
  ansible.builtin.systemd_service:
    name: wg-quick@chill0
    enabled: true
    state: started

- name: Ensure nftables is enabled and running
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Ensure caddy is enabled and running
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started

- name: Ensure CrowdSec is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - crowdsec
    - crowdsec-firewall-bouncer

- name: Install the external heartbeat client
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/edge-heartbeat.sh"
    dest: /usr/local/bin/homelab-edge-heartbeat
    mode: "0755"

- name: Install the external heartbeat units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-edge-heartbeat.service
    - homelab-edge-heartbeat.timer
  notify: Reload systemd

- name: Reload systemd before enabling the heartbeat timer
  ansible.builtin.meta: flush_handlers

- name: Enable the external heartbeat timer
  ansible.builtin.systemd_service:
    name: homelab-edge-heartbeat.timer
    enabled: true
    state: started
