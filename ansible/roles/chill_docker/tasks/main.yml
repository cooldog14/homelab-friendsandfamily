---
# Docker daemon config lives in git (host/daemon.json). A change restarts the
# daemon, which flaps every container and trips the public black-box check, so
# the handler only runs when the file actually differs.
- name: Install the Docker daemon configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/daemon.json"
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Ensure docker is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
