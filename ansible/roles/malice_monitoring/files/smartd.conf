# Managed by Ansible. Do not edit by hand.
# Short tests run daily at 02:00; long tests are staggered away from the
# Sunday 03:30 vzdump window. DEVICESCAN keeps monitoring any new disk.
DEVICESCAN -d removable -n standby -m root -M exec /usr/local/bin/smartd-notify
/dev/sda -a -o on -S on -s (S/../.././02|L/../../1/01) -m root -M exec /usr/local/bin/smartd-notify
/dev/sdb -a -o on -S on -s (S/../.././02|L/../../2/01) -m root -M exec /usr/local/bin/smartd-notify
/dev/sdd -a -o on -S on -s (S/../.././02|L/../../3/01) -m root -M exec /usr/local/bin/smartd-notify
/dev/sde -a -o on -S on -s (S/../.././02|L/../../6/01) -m root -M exec /usr/local/bin/smartd-notify
/dev/sdf -a -o on -S on -s (S/../.././02|L/../../6/01) -m root -M exec /usr/local/bin/smartd-notify
