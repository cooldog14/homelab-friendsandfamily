---
# Hypervisor monitoring and host backup units. The other VMs are intentionally
# outside this repository; only the hypervisor itself is addressed here.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the hypervisor exporter and backup dependency
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - restic
    state: present
    install_recommends: false

- name: Bind the exporter to the tailnet only
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      # Metrics are consumed by Prometheus on chill-01 over Tailscale. The
      # textfile collector is what homelab-metrics/homelab-backup-stats write.
      ARGS="--web.listen-address=100.99.204.109:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile"
  notify: Restart node exporter

- name: Create the node exporter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: "0755"

- name: Start the exporter after Tailscale
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/homelab.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=tailscaled.service
      After=tailscaled.service

      [Service]
      Restart=always
  notify: Restart node exporter

- name: Install the notification unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/notify@.service"
    dest: /etc/systemd/system/notify@.service
    mode: "0644"
  notify: Reload systemd

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the metric collectors
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    mode: "0755"
  loop:
    - {src: metrics.sh, dest: homelab-metrics}
    - {src: backup-stats.py, dest: homelab-backup-stats}

- name: Install the hypervisor backup helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/malice-restic-backup"
    dest: /usr/local/sbin/malice-restic-backup
    mode: "0700"
  notify: Reload systemd

- name: Install hypervisor backup and check units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - malice-restic-backup.service
    - malice-restic-backup.timer
    - malice-restic-check.service
    - malice-restic-check.timer
    - homelab-metrics.service
    - homelab-metrics.timer
    - homelab-backup-stats.service
    - homelab-backup-stats.timer
  notify: Reload systemd

# Both /etc/homelab.env and /etc/restic/malice.env exist on the hypervisor.
# Without an explicit override homelab-backup-stats samples chill-01's repos
# under host="malice", so the malice S3 repo is never watched.
- name: Create the backup stats drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/homelab-backup-stats.service.d
    state: directory
    mode: "0755"

- name: Point hypervisor backup stats at the malice restic repository
  ansible.builtin.copy:
    dest: /etc/systemd/system/homelab-backup-stats.service.d/env.conf
    mode: "0644"
    content: |
      [Service]
      Environment=BACKUP_STATS_ENV_FILE=/etc/restic/malice.env
      Environment=BACKUP_STATS_SKIP_LOCAL=1
  notify: Reload systemd

- name: Reload systemd before enabling new units
  ansible.builtin.meta: flush_handlers

- name: Enable hypervisor backup, metrics and stats timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - malice-restic-backup.timer
    - malice-restic-check.timer
    - homelab-metrics.timer
    - homelab-backup-stats.timer

- name: Install the SMART notification helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/smartd-notify.sh"
    dest: /usr/local/bin/smartd-notify
    mode: "0755"
  notify: Restart smartd

- name: Install the managed smartd configuration
  ansible.builtin.copy:
    src: files/smartd.conf
    dest: /etc/smartd.conf
    mode: "0644"
  notify: Restart smartd

- name: Ensure smartd is enabled and running
  ansible.builtin.systemd_service:
    name: smartd
    enabled: true
    state: started

- name: Ensure the node exporter is enabled and running
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started

# /etc/homelab.env is live-only (0600). A dead ALERT_URL silences malice's
# notify@ and smartd alerts; fail the play instead of shipping that state.
- name: Verify the Gotify alert URL exists and points at the private vhost
  ansible.builtin.shell:
    cmd: |
      set -eu
      test "$(stat -c %a /etc/homelab.env)" = 600
      grep -Eq '^ALERT_URL=https://gotify\.h\.malice\.biz/message' /etc/homelab.env ||
        { echo "ALERT_URL missing or not the private gotify.h/message endpoint" >&2; exit 1; }
  changed_when: false

# PVE's notification target is live-only too (notifications.cfg is cluster
# config, not git). Verify the gotify endpoint and matcher survive a rebuild.
- name: Verify PVE notifications target the Gotify endpoint
  ansible.builtin.shell:
    cmd: |
      set -eu
      cfg=/etc/pve/notifications.cfg
      test -r "$cfg" || { echo "PVE notifications.cfg missing" >&2; exit 1; }
      grep -Eq '^gotify:[[:space:]]' "$cfg" || { echo "PVE gotify endpoint missing" >&2; exit 1; }
      grep -Eq '^[[:space:]]*server[[:space:]]+https://gotify\.h\.malice\.biz' "$cfg" ||
        { echo "PVE gotify endpoint is not the private vhost" >&2; exit 1; }
      grep -Eq '^[[:space:]]*target[[:space:]]+gotify' "$cfg" ||
        { echo "PVE default matcher does not target gotify" >&2; exit 1; }
  changed_when: false
