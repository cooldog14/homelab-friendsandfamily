---
# Hypervisor monitoring and host backup units. The other VMs are intentionally
# outside this repository; only the hypervisor itself is addressed here.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install the hypervisor node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false

- name: Bind the exporter to the tailnet only
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    mode: "0644"
    content: |
      # Metrics are consumed by Prometheus on chill-01 over Tailscale. The
      # textfile collector is what homelab-metrics/homelab-backup-stats write.
      ARGS="--web.listen-address=100.99.204.109:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile"
  notify: Restart node exporter

- name: Create the node exporter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: "0755"

- name: Start the exporter after Tailscale
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/homelab.conf
    mode: "0644"
    content: |
      [Unit]
      Wants=tailscaled.service
      After=tailscaled.service

      [Service]
      Restart=always
  notify: Restart node exporter

- name: Install the notification unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/notify@.service"
    dest: /etc/systemd/system/notify@.service
    mode: "0644"
  notify: Reload systemd

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the metric collectors
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    mode: "0755"
  loop:
    - {src: metrics.sh, dest: homelab-metrics}
    - {src: backup-stats.py, dest: homelab-backup-stats}

- name: Install the hypervisor backup helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/malice-restic-backup"
    dest: /usr/local/sbin/malice-restic-backup
    mode: "0700"
  notify: Reload systemd

- name: Install hypervisor backup and check units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - malice-restic-backup.service
    - malice-restic-backup.timer
    - malice-restic-check.service
    - malice-restic-check.timer
    - homelab-metrics.service
    - homelab-metrics.timer
    - homelab-backup-stats.service
    - homelab-backup-stats.timer
  notify: Reload systemd

- name: Reload systemd before enabling new units
  ansible.builtin.meta: flush_handlers

- name: Enable hypervisor backup, metrics and stats timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - malice-restic-backup.timer
    - malice-restic-check.timer
    - homelab-metrics.timer
    - homelab-backup-stats.timer

- name: Ensure the node exporter is enabled and running
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
