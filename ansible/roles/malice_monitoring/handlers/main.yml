---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted

- name: Restart smartd
  ansible.builtin.systemd_service:
    name: smartd
    state: restarted
