---
# Host executables and systemd units. Every file ships from git (host/), so the
# VM only ever runs code that is committed and reviewed.
- name: Install host helper scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item.src }}"
    dest: "/usr/local/bin/{{ item.dest }}"
    mode: "0755"
  loop:
    - {src: backup.sh, dest: homelab-backup}
    - {src: backup-watchdog.sh, dest: homelab-backup-watchdog}
    - {src: public-check.sh, dest: homelab-public-check}
    - {src: metrics.sh, dest: homelab-metrics}
    - {src: firewall-neko.sh, dest: homelab-firewall-neko}
    - {src: restic-check.sh, dest: homelab-restic-check}
    - {src: restic-retention.py, dest: homelab-restic-retention}
    - {src: backup-stats.py, dest: homelab-backup-stats}
    - {src: wrtag-import.sh, dest: homelab-wrtag-import}
    - {src: music-import.py, dest: homelab-music-import}
    - {src: alert-check.sh, dest: homelab-alert-check}
    - {src: pipeline-check.sh, dest: homelab-pipeline-check}
    - {src: download-payloads.py, dest: homelab-download-payloads}

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../host/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - homelab-backup.service
    - homelab-backup.timer
    - homelab-backup-watchdog.service
    - homelab-backup-watchdog.timer
    - homelab-public-check.service
    - homelab-public-check.timer
    - homelab-docker-prune.service
    - homelab-docker-prune.timer
    - homelab-metrics.service
    - homelab-metrics.timer
    - homelab-restic-check.service
    - homelab-restic-check.timer
    - homelab-backup-stats.service
    - homelab-backup-stats.timer
    - homelab-firewall-neko.service
    - homelab-music-import.service
    - homelab-music-import.timer
    - notify@.service
    - homelab-alert-check.service
    - homelab-alert-check.timer
    - homelab-pipeline-check.service
    - homelab-pipeline-check.timer
    - homelab-download-payloads.service
    - homelab-download-payloads.timer
  notify: Reload systemd

- name: Reload systemd before touching the timers
  ansible.builtin.meta: flush_handlers

- name: Create the public Caddy site directory
  ansible.builtin.file:
    path: /usr/local/share/homelab-public-sites
    state: directory
    mode: "0755"

- name: Collect the public Caddy site names declared in git
  ansible.builtin.set_fact:
    chill_units_public_sites_wanted: >-
      {{ query('fileglob', playbook_dir + '/../vps/sites/*.caddy') | map('basename') | list }}

# Public vhosts are git-owned: ship the current set, then drop what git no
# longer declares so homelab-public-check never probes a deleted host.
- name: Install public Caddy site files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../vps/sites/{{ item }}"
    dest: "/usr/local/share/homelab-public-sites/{{ item }}"
    mode: "0644"
  loop: "{{ chill_units_public_sites_wanted }}"
  loop_control:
    label: "{{ item }}"

- name: List installed public Caddy site files
  ansible.builtin.find:
    paths: /usr/local/share/homelab-public-sites
    patterns: "*.caddy"
  register: chill_units_public_sites

- name: Remove public Caddy site files no longer in git
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ chill_units_public_sites.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in chill_units_public_sites_wanted

- name: Create the node_exporter textfile directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: root
    mode: "0755"


- name: Inspect download-payload scan directories without following symlinks
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  register: chill_units_download_payload_roots
  loop:
    - /mnt/data/downloads
    - /mnt/pool/downloads
    - /mnt/data/media/downloads
  changed_when: false

- name: Refuse scanner activation when a download root is not a real directory
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isdir | default(false)
      - not (item.stat.islnk | default(false))
    fail_msg: "Download-payload root must already be a real directory: {{ item.item }}"
  loop: "{{ chill_units_download_payload_roots.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Ensure homelab timers and services are enabled and running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - homelab-backup.timer
    - homelab-backup-watchdog.timer
    - homelab-public-check.timer
    - homelab-docker-prune.timer
    - homelab-metrics.timer
    - homelab-restic-check.timer
    - homelab-backup-stats.timer
    - homelab-firewall-neko.service
    - homelab-music-import.timer
    - homelab-alert-check.timer
    - homelab-pipeline-check.timer
    - homelab-download-payloads.timer

# /etc/homelab.env is deliberately live-only (0600), but a dead ALERT_URL
# silences every systemd/script alert (audit A1). Fail the play instead of
# shipping a host whose alert path cannot deliver. Never print the token.
- name: Verify the Gotify alert URL exists and points at the private vhost
  ansible.builtin.shell:
    cmd: |
      set -eu
      test "$(stat -c %a /etc/homelab.env)" = 600
      grep -Eq '^ALERT_URL=https://gotify\.h\.malice\.biz/message' /etc/homelab.env ||
        { echo "ALERT_URL missing or not the private gotify.h/message endpoint" >&2; exit 1; }
  changed_when: false
